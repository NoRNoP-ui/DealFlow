<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DealFlow">
<meta name="theme-color" content="#14213D">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DealFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* DealFlow — app shell. Gradient brand band (nuit → prune) carrying logo + tabs, bottom tab bar on phone, cards on a cool grey ground. Couleurs : mer (primaire), corail (action), soleil, menthe, violet. Chaque statut et chaque type d'action a sa couleur. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F5F8FA; --ink:#0F1E2B; --muted:#5A6B78; --line:#DBE3E9;
  --brand-1:#14213D; --brand-2:#14213D; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.72);
  --sea:#0B6E8A; --sea-soft:#DDF0F5; --coral:#E8574C; --coral-soft:#FDE7E4; --sun:#C98410; --sun-soft:#FCF0D9;
  --mint:#1E9A6E; --mint-soft:#DDF3EA; --violet:#6A4FD1; --violet-soft:#ECE7FB; --sky:#2C6CD1; --sky-soft:#E3ECFB;
  --pink:#C2417F; --pink-soft:#FBE5EF; --slate:#56677A; --slate-soft:#E7ECF1;
  --accent:#0B6E8A; --accent-ink:#FFFFFF; --cta:#FF5A47; --cta-ink:#FFFFFF;
  --late:#D23A2F; --late-soft:#FCE6E3; --today:#B87308; --today-soft:#FCEFD6; --week:#2C6CD1; --week-soft:#E3ECFB; --done:#1E9A6E; --done-soft:#DDF3EA;
  --av-l:90%; --av-s:60%; --av-ink:28%;
  --shadow:0 1px 2px rgba(15,30,43,.06),0 6px 18px rgba(15,30,43,.06);
  --sea-map:#CFE6EF; --land:#F4F1EA; --land-line:#C9D6DD; --land-ink:#4B5B66;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea-map:#0E2633; --land:#1B2832; --land-line:#2F4350; --land-ink:#B5C4CE; --bg:#0C141B; --surface:#141F28; --surface-2:#1A2731; --ink:#E6EEF3; --muted:#93A4B1; --line:#263744;
  --brand-1:#0E1830; --brand-2:#0E1830; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.7);
  --sea:#4CC0DB; --sea-soft:#123744; --coral:#FF8378; --coral-soft:#3D1F1D; --sun:#F2C063; --sun-soft:#3A2E16;
  --mint:#5ED3A5; --mint-soft:#143428; --violet:#A893F5; --violet-soft:#2A2350; --sky:#86AEF5; --sky-soft:#1B2A47;
  --pink:#F08DBB; --pink-soft:#3D1D2D; --slate:#A6B5C3; --slate-soft:#22313D;
  --accent:#4CC0DB; --accent-ink:#06171D; --cta:#FF7468; --cta-ink:#1E0806;
  --late:#FF8378; --late-soft:#3D1F1D; --today:#F2C063; --today-soft:#3A2E16; --week:#86AEF5; --week-soft:#1B2A47; --done:#5ED3A5; --done-soft:#143428;
  --av-l:24%; --av-s:40%; --av-ink:86%; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --sea-map:#0E2633; --land:#1B2832; --land-line:#2F4350; --land-ink:#B5C4CE; --bg:#0C141B; --surface:#141F28; --surface-2:#1A2731; --ink:#E6EEF3; --muted:#93A4B1; --line:#263744;
  --brand-1:#0E1830; --brand-2:#0E1830; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.7);
  --sea:#4CC0DB; --sea-soft:#123744; --coral:#FF8378; --coral-soft:#3D1F1D; --sun:#F2C063; --sun-soft:#3A2E16;
  --mint:#5ED3A5; --mint-soft:#143428; --violet:#A893F5; --violet-soft:#2A2350; --sky:#86AEF5; --sky-soft:#1B2A47;
  --pink:#F08DBB; --pink-soft:#3D1D2D; --slate:#A6B5C3; --slate-soft:#22313D;
  --accent:#4CC0DB; --accent-ink:#06171D; --cta:#FF7468; --cta-ink:#1E0806;
  --late:#FF8378; --late-soft:#3D1F1D; --today:#F2C063; --today-soft:#3A2E16; --week:#86AEF5; --week-soft:#1B2A47; --done:#5ED3A5; --done-soft:#143428;
  --av-l:24%; --av-s:40%; --av-ink:86%; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-1)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand-1);color:var(--on-brand)}
header.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt b em{font-style:normal;color:#FFB13B}
.brand-txt b{font-family:var(--f-display);font-weight:800;font-size:1.22rem;letter-spacing:-.01em;line-height:1.05}
.brand-txt span{font-size:.72rem;color:var(--on-brand-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refresh{display:flex;align-items:center;gap:8px;color:var(--on-brand-muted);font-size:.78rem}
@media (max-width:480px){#updated{display:none}}
.btn-ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--on-brand);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.btn-ghost[disabled]{opacity:.6}
.tabs-top{display:none;gap:2px}
.tab{background:none;border:0;padding:10px 14px 12px;font-weight:700;font-size:.9rem;color:var(--on-brand-muted);display:inline-flex;gap:6px;align-items:center;border-bottom:3px solid transparent}
.tabs-top .tab[aria-current="page"]{color:var(--on-brand);border-bottom-color:var(--cta)}
.tabs-top .tab:hover{color:var(--on-brand)}
.bdg{font-size:.68rem;background:var(--cta);color:var(--cta-ink);border-radius:999px;padding:1px 6px;font-variant-numeric:tabular-nums;font-weight:800}
.spacer-b{height:10px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(15,30,43,.06)}
nav.bottom .tab{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 2px;justify-content:center;position:relative;color:var(--muted);border:0}
nav.bottom .tab svg{width:23px;height:23px}
nav.bottom .tab[aria-current="page"]{color:var(--accent)}
nav.bottom .tab[aria-current="page"] svg{stroke-width:2.3}
nav.bottom .tab .bdg{position:absolute;top:1px;left:calc(50% + 6px)}
@media (min-width:760px){.tabs-top{display:flex} nav.bottom{display:none} .spacer-b{display:none} .fab{bottom:calc(env(safe-area-inset-bottom,0px) + 24px)!important}}

main .wrap{padding-block:18px 160px;display:flex;flex-direction:column;gap:22px}
.hello{display:flex;flex-direction:column;gap:2px}
.hello h1{font-family:var(--f-display);font-size:1.7rem;font-weight:800;margin:0;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
.hello p{margin:0;color:var(--muted);font-weight:500}
.hello p b{color:var(--ink)}
section.group{display:flex;flex-direction:column;gap:10px}
.g-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.g-head h2{font-family:var(--f-display);font-weight:800;font-size:1.08rem;margin:0}
.g-head span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.g-head .lnk{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:700;font-size:.85rem;padding:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{--c:var(--sea);--cs:var(--sea-soft);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:4px;text-align:left;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--cs)}
.kpi .ic{width:30px;height:30px;border-radius:9px;background:var(--cs);color:var(--c);display:grid;place-items:center;position:relative;z-index:1}
.kpi .ic svg{width:17px;height:17px}
.kpi b{font-family:var(--f-display);font-size:1.95rem;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c);position:relative;z-index:1}
.kpi span{color:var(--muted);font-size:.8rem;font-weight:700;position:relative;z-index:1}
button.kpi:hover{border-color:var(--c)}
.k-coral{--c:var(--coral);--cs:var(--coral-soft)} .k-sun{--c:var(--sun);--cs:var(--sun-soft)} .k-mint{--c:var(--mint);--cs:var(--mint-soft)}
.k-violet{--c:var(--violet);--cs:var(--violet-soft)} .k-sky{--c:var(--sky);--cs:var(--sky-soft)} .k-pink{--c:var(--pink);--cs:var(--pink-soft)} .k-slate{--c:var(--slate);--cs:var(--slate-soft)}

.cta-band{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--brand-1);color:var(--on-brand);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.cta-band div{flex:1;min-width:180px}
.cta-band.mail-band{background:#3B2A7A}
.panel-head .actions{flex-wrap:wrap;justify-content:flex-end}
.cta-band b{font-family:var(--f-display);font-size:1.1rem;display:block}
.cta-band span{color:var(--on-brand-muted);font-size:.85rem}
.btn-cta{background:var(--cta);color:var(--cta-ink);border:0;border-radius:11px;padding:11px 16px;font-weight:800;font-size:.92rem}
.btn-cta[disabled]{opacity:.5}

.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 15px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--line);min-width:0}
.task.late{border-left-color:var(--late)} .task.today{border-left-color:var(--today)} .task.week{border-left-color:var(--week)} .task.later{border-left-color:var(--slate-soft)}
.task.done{border-left-color:var(--done);box-shadow:none;background:var(--surface-2)}
.task.done .co-btn{text-decoration:line-through;text-decoration-color:var(--muted)}
.t-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.when{font-weight:800;font-size:.78rem;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.late .when,.when.late{background:var(--late-soft);color:var(--late)} .today .when,.when.today{background:var(--today-soft);color:var(--today)}
.week .when,.when.week{background:var(--week-soft);color:var(--week)} .done .when{background:var(--done-soft);color:var(--done)}
.ty{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;background:var(--cs);color:var(--c)}
.ty svg{width:13px;height:13px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{--h:200;width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 55% var(--av-ink))}
.co-btn{background:none;border:0;padding:0;text-align:left;font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.co-btn:hover{color:var(--accent)}
.who-t{display:flex;flex-direction:column;min-width:0;gap:1px}
.meta{color:var(--muted);font-size:.83rem;display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center}
.contact-line{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.num{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.num span{user-select:all}
.num a{color:var(--mint);text-decoration:none;font-weight:800;font-size:.76rem;background:var(--mint-soft);padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.num a svg{width:12px;height:12px}
.copy{background:none;border:0;color:var(--muted);font-size:.74rem;font-weight:700;padding:2px 4px}
.copy:hover{color:var(--accent)}
.mail{font-size:.84rem;color:var(--muted);word-break:break-all;user-select:all}
.note{margin:0;font-size:.87rem;background:var(--surface-2);border-radius:9px;padding:8px 10px;overflow-wrap:anywhere}
.note b{color:var(--muted);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
.btn{border-radius:10px;padding:9px 14px;font-weight:700;font-size:.87rem;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.danger{color:var(--late);border-color:var(--late-soft)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:progress}

.st{--c:var(--slate);--cs:var(--slate-soft);font-size:.74rem;font-weight:800;color:var(--c);background:var(--cs);padding:3px 9px;border-radius:999px;white-space:nowrap}
.s0{--c:var(--slate);--cs:var(--slate-soft)} .s1{--c:var(--sky);--cs:var(--sky-soft)} .s2{--c:var(--violet);--cs:var(--violet-soft)}
.s3{--c:var(--sea);--cs:var(--sea-soft)} .s4{--c:var(--sun);--cs:var(--sun-soft)} .s5{--c:var(--pink);--cs:var(--pink-soft)}
.s6{--c:var(--mint);--cs:var(--mint-soft)} .s7{--c:var(--coral);--cs:var(--coral-soft)} .s8{--c:var(--slate);--cs:var(--slate-soft)}

details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"Afficher";margin-left:auto;font-size:.82rem;font-weight:700;color:var(--accent)}
details.more[open]>summary::after{content:"Masquer"}
details.more .list{display:flex;flex-direction:column;gap:10px;margin-top:10px}

.toolbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow)}
.search select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px;max-width:46%}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:700;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill small{opacity:.75;font-variant-numeric:tabular-nums;margin-left:4px}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow .av{grid-row:1/3}
.crow .nm{font-weight:800;font-size:.98rem;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.crow .sub{grid-column:2/4;color:var(--muted);font-size:.82rem;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.prio{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.prio.Chaud{background:var(--coral)} .prio.Tiède{background:var(--sun)} .prio.Froid{background:var(--sky)}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 255px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:10px;min-width:0}
.col h3{margin:0;font-family:var(--f-display);font-size:.95rem;display:flex;justify-content:space-between;gap:8px;color:var(--c)}
.col h3 span{background:var(--cs);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%;align-items:flex-start}
.pcard:hover{border-color:var(--c)}
.pcard b{font-size:.92rem;overflow-wrap:anywhere}
.pcard span.m{font-size:.78rem;color:var(--muted)}
.funnel{display:flex;flex-direction:column;gap:7px}
.fl-row{display:grid;grid-template-columns:minmax(110px,36%) 1fr 2.2em;gap:10px;align-items:center;font-size:.85rem;background:none;border:0;padding:0;text-align:left;width:100%}
.fl-row .tr{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.fl-row .f{display:block;height:100%;background:var(--c);border-radius:7px;min-width:3px}
.fl-row b{text-align:right;font-variant-numeric:tabular-nums}

.jday{display:flex;flex-direction:column;gap:6px}
.jday h3{margin:0;font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.jrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.jrow:hover{border-color:var(--accent)}
.jrow b{overflow-wrap:anywhere}
.jrow .t{grid-column:1/-1;font-size:.86rem;overflow-wrap:anywhere;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.jrow .n{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
.res{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--slate-soft);color:var(--slate);white-space:nowrap}
.res.r0{background:var(--mint-soft);color:var(--mint)} .res.r1{background:var(--sky-soft);color:var(--sky)} .res.r2{background:var(--coral-soft);color:var(--coral)} .res.r3,.res.r4{background:var(--sun-soft);color:var(--sun)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0;font-family:var(--f-display);font-size:1.02rem;font-weight:800}

/* terrain */
.map-wrap{position:relative;isolation:isolate;z-index:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
#map{height:min(76vh,760px);min-height:380px;background:var(--sea-map)}
.map-wrap.full{position:fixed;inset:0;z-index:14;border-radius:0;border:0}
.map-wrap.full #map{height:100%;min-height:0}
.map-tools{position:absolute;z-index:500;top:max(10px,env(safe-area-inset-top,0px));right:10px;display:flex;flex-direction:column;gap:8px}
.map-tools button{border:0;border-radius:12px;background:var(--surface);color:var(--ink);font-weight:800;font-size:.8rem;padding:9px 12px;box-shadow:0 2px 10px rgba(15,30,43,.2);display:flex;align-items:center;gap:6px}
.map-tools button.on{background:var(--sky);color:#fff}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2C6CD1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(44,108,209,.25)}
.near{display:flex;flex-direction:column;gap:8px}
.near .rows .crow .nm::after{content:attr(data-km);margin-left:auto;font-size:.78rem;font-weight:800;color:var(--sky);white-space:nowrap}
.pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pick select{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px}
.leaflet-container{font-family:var(--f-body);background:var(--sea-map)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:14px}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:12px 14px;min-width:220px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.leaflet-popup-content b.t{font-family:var(--f-display);font-size:1.05rem}
.leaflet-popup-content .actions{gap:6px}
.leaflet-popup-content .actions a,.leaflet-popup-content .actions button{text-decoration:none;color:inherit}
.town-lbl{font-family:var(--f-display);font-weight:800;font-size:11px;color:var(--land-ink);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.map-legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.map-legend span{display:inline-flex;align-items:center;gap:5px}
.map-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.town-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
/* optimisations */
.express{display:flex;gap:6px;overflow-x:auto;padding-top:2px;scrollbar-width:none}
.express::-webkit-scrollbar{display:none}
.express button{flex:none;border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--ink)}
.express button:hover{border-color:var(--accent);border-style:solid}
.express button[disabled]{opacity:.5}
.call .express{flex-wrap:wrap;overflow:visible}
.mg-obj,.mg-obj-set{margin-top:12px;background:rgba(255,255,255,.08);border:0;border-radius:12px;padding:10px 12px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.mg-obj-set{align-items:center;font-weight:800;font-size:.85rem;border:1px dashed rgba(255,255,255,.3);background:none}
.mg-obj-top{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700}
.mg-obj-top b{font-family:var(--f-display);font-size:1rem}
.mg-obj-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.mg-obj-bar i{display:block;height:100%;background:#1E9A6E;border-radius:4px}
.mg-obj small{font-size:.72rem;opacity:.8}
.tour{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.empty-tour{flex-direction:column;gap:4px}.empty-tour span{color:var(--muted);font-size:.85rem}
.tour-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tour-list li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center}
.tour-list .n{width:26px;height:26px;border-radius:50%;background:#14213D;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.tour-list .tl{background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.tour-list .tl small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour-list .x{background:none;border:0;color:var(--muted);font-weight:800;padding:6px}
.tour-go{text-align:center;text-decoration:none}
.tour-row{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid var(--line)}
.tour-row .crow{border-bottom:0}
.tour-add{width:36px;height:36px;margin-right:10px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--accent)}
.tour-add.on{background:#14213D;color:#fff;border-color:#14213D}
.prep{display:flex;flex-direction:column;gap:10px}
.prep-b{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.prep-b.hl{background:#14213D;color:#fff}
.prep-b span{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.prep-b p{margin:4px 0 0;font-size:.92rem}
.prep-b ul{margin:6px 0 0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.prep-b .obj{margin-top:8px}.prep-b .obj b{font-size:.88rem}.prep-b .obj p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
/* ===== UX dynamique ===== */
@media (prefers-reduced-motion:no-preference){
  #app.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .overlay{animation:fade .18s ease both}.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1) both}
  @media (min-width:700px){.sheet{animation:pop .22s cubic-bezier(.2,.8,.2,1) both}}
  .panel-wrap{animation:fade .18s ease both}.panel,.chat{animation:slide .3s cubic-bezier(.2,.8,.2,1) both}
  .toast{animation:toast .3s cubic-bezier(.2,.8,.2,1) both}
  @keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes pop{from{transform:scale(.96);opacity:0}}
  @keyframes slide{from{transform:translateX(40px);opacity:.3}}@keyframes toast{from{transform:translate(-50%,20px);opacity:0}}
  .ring-p{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
  .mg-obj-bar i,.bar .fl,.fl-row .f,.cols .c i{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleX(0);transform-origin:left}}
  .cols .c i{animation-name:growy}@keyframes growy{from{transform:scaleY(0);transform-origin:bottom}}
}
.btn,.btn-cta,.pill,.kpi,.express button,.tab,.fab,.ai-fab,.crow,.pcard,.jrow,.mini button{transition:transform .12s ease,background-color .15s,border-color .15s,box-shadow .15s}
.btn:active,.btn-cta:active,.pill:active,.kpi:active,.express button:active,.fab:active,.ai-fab:active,.crow:active,.pcard:active,.jrow:active{transform:scale(.97)}
@media (hover:hover){.kpi:hover,.task:hover,.card:hover{box-shadow:0 2px 4px rgba(15,30,43,.06),0 12px 28px rgba(15,30,43,.1)}.kpi:hover{transform:translateY(-2px)}}
.task{position:relative;touch-action:pan-y}
.task[data-sw]::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.12}
.task[data-sw="r"]::after{background:var(--mint)}.task[data-sw="l"]::after{background:var(--sun)}
.task.sw-ok[data-sw="r"]{box-shadow:0 0 0 2px var(--mint)}.task.sw-ok[data-sw="l"]{box-shadow:0 0 0 2px var(--sun)}
.swipe-hint{margin:0;font-size:.78rem;color:var(--muted);text-align:center}
@media (hover:hover){.swipe-hint{display:none}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 4px);transform:translate(-50%,-80px);z-index:9;background:var(--surface);color:var(--ink);font-weight:700;font-size:.8rem;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);transition:transform .2s}
.confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ring{position:relative;flex:none;width:86px;height:86px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--ink)}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring-n{position:relative;display:flex;align-items:baseline;margin-top:-10px}
.ring-n b{font-family:var(--f-display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums}
.ring-n small{font-size:.72rem;color:var(--muted);font-weight:700}
.ring-l{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.66rem;font-weight:800;color:var(--muted);background:var(--bg);padding:0 4px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.tip span{font-size:1.1rem;line-height:1.3}.tip p{margin:0;font-size:.86rem}
nav.bottom .tab[aria-current="page"] svg{background:var(--accent-soft);border-radius:999px;padding:2px 12px;width:46px;box-sizing:content-box;margin:0 -12px}
.tabs-top .tab svg{width:17px;height:17px}
/* bureau : barre latérale */
@media (min-width:1100px){
  header.top .wrap{max-width:none}
  .tabs-top{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 62px);bottom:0;width:216px;flex-direction:column;gap:4px;padding:14px 12px;background:var(--brand-1);z-index:4}
  .tabs-top .tab{border-bottom:0;border-radius:10px;justify-content:flex-start;padding:11px 14px;font-size:.95rem}
  .tabs-top .tab[aria-current="page"]{background:rgba(255,255,255,.12)}

async function api(method,payload){
  if(!CFG)throw{code:"nocfg",message:"Connexion non configurée"};
  let r;
  try{
    if(method==="GET")r=await fetch(CFG.url+"?api=get&t="+encodeURIComponent(CFG.token)+"&range="+encodeURIComponent(payload.range),{redirect:"follow"});
    else r=await fetch(CFG.url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({t:CFG.token},payload))});
  }catch(e){throw{code:"offline",message:"Pas de connexion internet"}}
  let j=null;try{j=await r.json()}catch(e){throw{code:"api",message:"Réponse illisible du serveur Google. Vérifie le lien /exec."}}
  if(!j.ok)throw{code:j.error==="Code incorrect"?"badtoken":"api",message:j.error||"Erreur Google"};

}

  if(c==="selection_required")return["Choisis ton compte Google","Tu as plusieurs connexions Google Sheets. Choisis-en une dans l'invite de claude.ai."];
  if(c==="blocked_by_policy")return["Accès bloqué par ton organisation","Ton organisation empêche cette page d'utiliser Google Sheets."];
  if(c==="badtoken")return["Code secret incorrect","Touche « Réglages » en bas de l'accueil pour corriger ton code."];
  if(c==="offline")return["Pas de connexion internet",writing?"L'action n'a pas été enregistrée. Réessaie quand tu as du réseau.":"Tu vois tes dernières données enregistrées. Elles se mettront à jour au retour du réseau."];

}

    if(!vis(C.get(r.s)))return;
    if(r.h){let sup=false;
      if(r.g){const own=r.a?r.a.getTime():0;for(let k=idx+1;k<J.length;k++){const o=J[k];if(o.s===r.s&&o.d===r.g&&(o.a?o.a.getTime():0)>=own){sup=true;break}}}
      if(!sup)tasks.push({id:"P"+r.row,kind:"P",row:r.row,date:r.h,time:r.i,company:r.s,action:r.g||"Action",contact:r.c})}

function tabsHtml(bottom){const late=M?M.g.late.length:0;return VIEWS.map(([k,l])=>`<button class="tab" type="button" data-view="${k}" ${S.view===k?'aria-current="page"':""}>${svg(k,1.9)}${l}${k==="journee"&&late?`<span class="bdg">${late}</span>`:""}</button>`).join("")}
function render(){
  updRefresh();
  const app=$("#app");
  if(S.error&&!S.loaded){const[h,p]=errorCopy(S.error,false);app.innerHTML=`<div class="banner"><strong>${esc(h)}</strong><span>${esc(p)}</span></div>`;$("#fab").hidden=true;$("#tabs-top").innerHTML="";$("#tabs-bottom").innerHTML="";return}
  if(!S.loaded)return;
  const openKeys=[...app.querySelectorAll("details[open]")].map(d=>d.id);
  const ae=document.activeElement,focusId=ae&&ae.id,selStart=focusId&&ae.selectionStart;
  M=build();
  $("#tabs-top").innerHTML=tabsHtml(false);$("#tabs-bottom").innerHTML=tabsHtml(true);
  const banner=S.error?`<div class="banner"><strong>${esc(errorCopy(S.error,false)[0])}</strong><span>${esc(errorCopy(S.error,false)[1])}</span></div>`:"";
  const v={accueil:vAccueil,journee:vJournee,terrain:vTerrain,comptes:vComptes,pipeline:vPipeline,journal:vJournal}[S.view]||vAccueil;
  const changed=S._lastView!==S.view;S._lastView=S.view;
  app.innerHTML=banner+scopeBar()+v();
  if(changed&&!RM){app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter");[...app.children].forEach((el,i)=>el.style.setProperty("--d",Math.min(i,8)*45+"ms"));countUp(app)}
  if(S.view==="terrain")initMap();else if(MAP){try{MAP.remove()}catch(e){}MAP=null}
  openKeys.forEach(k=>{const d=document.getElementById(k);if(d)d.open=true});
  if(focusId==="c-q"||focusId==="j-q"){const el=document.getElementById(focusId);if(el){el.focus();try{el.setSelectionRange(selStart,selStart)}catch(e){}}}
  $("#fab").hidden=false;$("#fab").textContent=S.view==="comptes"?"+ Compte":"+ Action";
  renderFiche();renderCall();
}
function setView(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}try{localStorage.setItem("cp-view",v)}catch(e){}window.scrollTo(0,0);render()}

const RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count||0,fmt=el.dataset.fmt;if(!to)return;const t0=performance.now(),dur=750;
    const f=n=>fmt==="eur"?eur(n):String(Math.round(n));
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(to*e);if(k<1)requestAnimationFrame(step);else el.textContent=f(to)};
    el.textContent=f(0);requestAnimationFrame(step)});
}
function confetti(){
  if(RM)return;const c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext("2d"),cols=["#FF5A47","#FFB13B","#1E9A6E","#2C6CD1","#6A4FD1","#FF3D6E"];
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*6+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();(function fr(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(t-t0<1600)requestAnimationFrame(fr);else c.remove()})(t0);
}
let toastT=null;
function toast(msg){const r=$("#toast-root");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML="",3200)}

/* ---------- forms ---------- */
function closeSheet(){$("#modal-root").innerHTML=""}
function pills(name,opts,cur){return `<div class="pills" data-pills="${name}">${opts.map(o=>`<button type="button" class="pill" data-val="${esc(o)}" aria-pressed="${o===cur}">${esc(o)}</button>`).join("")}</div>`}
function sel(id,opts,cur,blank){const list=cur&&!opts.includes(cur)?[cur,...opts]:opts;return `<select id="${id}">${blank!=null?`<option value="">${esc(blank)}</option>`:""}${list.map(o=>`<option ${o===cur?"selected":""}>${esc(o)}</option>`).join("")}</select>`}
const inp=(id,lbl,v,extra)=>`<div class="field"><label for="${id}">${lbl}</label><input id="${id}" value="${esc(v||"")}" ${extra||""}></div>`;
const dl=(id,opts)=>`<datalist id="${id}">${opts.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>`;
function dateBlock(prefix,defDate,defTime,lbl){
  return `<div class="two"><div class="field"><label for="${prefix}-date">${lbl||"Date"}</label><input type="date" id="${prefix}-date" value="${iso(defDate)}"></div>
    <div class="field"><label for="${prefix}-time">Heure</label>${sel(prefix+"-time",HOURS,defTime||"","Sans heure")}</div></div>
    <div class="pills">${QUICK.map(([l],i)=>`<button type="button" class="pill" data-q="${i}" data-qp="${prefix}">${l}</button>`).join("")}</div>`;
}
const nextBlock=(t,d)=>`<h4>Prochaine action</h4><div class="field"><label for="f-next">Type</label>${sel("f-next",L.types,t||"","Aucune")}</div>${dateBlock("n",d,"","Date")}`;
function openSheet(title,sub,body,opts){
  $("#modal-root").innerHTML=`<div class="overlay" data-close="1"><form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:""}${body}
    <div class="err" id="f-err" hidden></div>
    <div class="sheet-actions">${opts.left||""}<button type="button" class="btn" data-close="1">Annuler</button><button type="submit" class="btn primary" id="f-save">${opts.save||"Enregistrer"}</button></div></form></div>`;
  const sh=$("#sheet");
  sh.addEventListener("click",e=>{
    const p=e.target.closest(".pill[data-val]");if(p){const g=p.parentElement,was=p.getAttribute("aria-pressed")==="true";g.querySelectorAll(".pill").forEach(x=>x.setAttribute("aria-pressed","false"));p.setAttribute("aria-pressed",String(!was));if(opts.onPill)opts.onPill(g.dataset.pills,p.dataset.val,!was)}
    const q=e.target.closest("[data-q]");if(q){$("#"+q.dataset.qp+"-date").value=iso(QUICK[+q.dataset.q][1]());if(opts.onQuick)opts.onQuick()}
    const del=e.target.closest("[data-del]");if(del&&opts.onDelete)opts.onDelete(del);
  });
  sh.addEventListener("submit",e=>{e.preventDefault();opts.onSave()});
  const first=sh.querySelector("textarea,input:not([type=checkbox]):not([type=date])");if(first&&window.matchMedia("(min-width:700px)").matches)setTimeout(()=>first.focus(),30);
}
function showErr(msg){const el=$("#f-err");el.textContent=msg;el.hidden=false;const b=$("#f-save");if(b)b.disabled=false}
const val=id=>{const el=document.getElementById(id);return el?norm(el.value):""};
const pillVal=name=>{const p=document.querySelector(`[data-pills="${name}"] .pill[aria-pressed="true"]`);return p?p.dataset.val:""};
async function guard(fn){const b=$("#f-save");if(b)b.disabled=true;try{await fn()}catch(e){const[h,p]=errorCopy(e,true);if($("#f-err"))showErr(h+". "+p);else toast(h)}}
async function nextFreeJournalRow(){const fresh=await getRange(J_RANGE);let last=-1;fresh.forEach((r,i)=>{if(norm(r[1]))last=i});return last+3}
const telOut=s=>{s=norm(s);return s&&/^[\d+]/.test(s)?"'"+s:s};

function formAction(mode,task,company,after){
  const co=company||(task&&task.company)||"";const c=M.C.get(co)||{};
  const isNrp=mode==="nrp";const same=task&&L.types.includes(task.action)?task.action:"Appel téléphonique";
  const body=`${mode==="new"?`<div class="field"><label for="f-co">Compte</label><input id="f-co" list="dl-co" value="${esc(co)}" placeholder="Nom de la société" autocomplete="off">${dl("dl-co",M.Clist.map(x=>x.name).sort((a,b)=>a.localeCompare(b,"fr")))}</div>
      <div class="two"><div class="field"><label for="f-type">Action réalisée</label>${sel("f-type",L.types,"Appel téléphonique")}</div><div class="field"><label for="f-date">Date</label><input type="date" id="f-date" value="${iso(today0())}"></div></div>`:""}
    <div class="field"><label for="f-ct">Interlocuteur</label><input id="f-ct" value="${esc(task?(task.contact||c.contact||""):(c.contact||""))}" placeholder="Nom, fonction"></div>
    <div class="field"><label for="f-cr">Compte rendu</label><textarea id="f-cr" placeholder="Ce qui s'est dit, ce qui est convenu">${isNrp?"Ne répond pas.":""}</textarea></div>
    <div class="field"><span class="lbl">Résultat</span>${pills("res",L.resultats,isNrp?"Pas de réponse":"")}</div>
    ${nextBlock(isNrp?same:"",isNrp?addBiz(2):null)}
    <div class="field"><label for="f-st">Statut du compte</label>${sel("f-st",L.statuts,c.statut||"","Ne pas changer")}</div>`;
  openSheet(mode==="new"?"Nouvelle action":"Compte rendu",task?`${task.company} · ${task.action}`:"Enregistre une action déjà réalisée.",body,{
    onPill:(name,v,on)=>{if(name!=="res"||!on)return;const nx=$("#f-next"),dt=$("#n-date");if(dt.value)return;
      if(v==="Pas de réponse"){nx.value=nx.value||same;dt.value=iso(addBiz(2))}
      if(v==="Absent / à rappeler"){nx.value=nx.value||same;dt.value=iso(addBiz(1))}},
    onQuick:()=>{const nx=$("#f-next");if(!nx.value)nx.value=same},
    onSave:()=>guard(async()=>{
      const company=mode==="new"?val("f-co"):task.company;const compte=M.C.get(company);
      if(!company)return showErr("Indique le compte.");
      if(mode==="new"&&!compte)return showErr("Ce compte n'existe pas. Choisis-le dans la liste ou crée-le dans Comptes.");
      const next=val("f-next"),nD=fromIso(val("n-date")),nT=val("n-time");
      if(next&&!nD)return showErr("Choisis la date de la prochaine action.");
      if(!next&&nD)return showErr("Choisis le type de la prochaine action.");
      const cr=val("f-cr"),ct=val("f-ct"),st=val("f-st"),res=pillVal("res"),nd=nD?fr(nD):"",time=next?nT:"";
      if(task&&task.kind==="A")await setRange(`'Journal (base)'!C${task.row}:J${task.row}`,[[ct,task.action,[norm(task.cr),cr].filter(Boolean).join(" "),res,next,nd,time,true]]);
      else{const row=await nextFreeJournalRow();const d=mode==="new"?(fromIso(val("f-date"))||today0()):today0();
        await setRange(`'Journal (base)'!A${row}:K${row}`,[[fr(d),company,ct,mode==="new"?val("f-type"):task.action,cr,res,next,nd,time,true,USER]])}
      if(compte&&st&&st!==compte.statut){try{await setRange(`Comptes!N${compte.row}`,[[st]])}catch(e){toast("Action enregistrée, statut non modifié.")}}
      if(compte&&st==="Gagné"&&compte.statut!=="Gagné"){closeSheet();if(after)after();await load();formWon(M.C.get(compte.name)||compte);return}
      closeSheet();toast("Enregistré dans ton CRM");if(after)after();await load();
    })});
}
function formObjectif(){
  openSheet("Objectif du mois",`Ta marge à signer chaque mois. La commission (${Math.round(COMM*100)} %) est calculée automatiquement.`,`${inp("o-val","Objectif de marge mensuel (€)",S.objectif||"",'inputmode="decimal"')}`,{save:"Enregistrer",onSave:()=>guard(async()=>{
    const v=num(val("o-val"));if(S.me&&S.me.row)await setRange(`Utilisateurs!E${S.me.row}`,[[v||""]]);else await setRange("Listes!I2",[[v||""]]);S.objectif=v;if(S.me)S.me.obj=v;closeSheet();toast(v?"Objectif fixé à "+eur(v):"Objectif retiré");render()})});

function margeValues(){const d=fromIso(val("k-dsig"));const p=num(val("k-pot")),g=num(val("k-sig"));return[p||"",g||"",d?fr(d):(g&&val("k-st")==="Gagné"?fr(today0()):"")]}
function compteValues(name){const dv=id=>{const d=fromIso(val(id));return d?fr(d):""};
  return[name,val("k-sect"),val("k-ville"),val("k-adr"),dv("k-vis"),val("k-ct"),val("k-fct"),telOut(val("k-tel")),val("k-mail"),val("k-bes"),val("k-pre"),dv("k-ech"),val("k-pri"),val("k-st"),val("k-com")]}
function formCompte(mode){
  const isNew=mode==="new";const c=isNew?null:M.C.get(S.fiche);
  const body=compteFields(c,isNew)+(isNew?`<h4>Action réalisée</h4>
    <div class="field"><label for="f-type">Type</label>${sel("f-type",L.types,"Visite physique","Aucune pour l'instant")}</div>

    <div class="field"><span class="lbl">Résultat</span>${pills("res",L.resultats,"")}</div>${nextBlock("",null)}`:`<p class="mail">Pour renommer un compte, passe par le chat : le nom relie la fiche à tout son historique.</p>`);
  openSheet(isNew?"Nouveau compte":"Modifier la fiche",isNew?"La fiche va dans Comptes, l'action dans le Journal.":c.name,body,{
    onQuick:()=>{const nx=$("#f-next");if(nx&&!nx.value)nx.value="Appel téléphonique"},

      if(isNew){

        const type=val("f-type"),next=val("f-next"),nD=fromIso(val("n-date")),nT=val("n-time");
        if(next&&!nD)return showErr("Choisis la date de la prochaine action.");

      closeSheet();toast("Action corrigée");await load()})});

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const cp=e.target.closest("[data-copy]");
  if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);cp.textContent="Copié";setTimeout(()=>cp.textContent="Copier",1400)}catch(err){const s=window.getSelection(),r=document.createRange();r.selectNodeContents(cp.previousElementSibling||cp.parentElement);s.removeAllRanges();s.addRange(r)}return}
  if(e.target.closest("a[href^='tel:']"))return;
  if(e.target.matches("[data-close]")){closeSheet();return}
  if(!M)return;

      ${it.match&&!it.full?`<button class="lnk" type="button" data-clafull="${i}" style="align-self:flex-start">+ Modifier d'autres champs</button>`:""}
      <h4>Action réalisée</h4>
      <div class="two"><div class="field"><label for="c${i}-at">Type</label>${sel(`c${i}-at`,L.types,it.a.type,"Aucune")}</div>
        <div class="field"><label for="c${i}-ad">Date</label><input type="date" id="c${i}-ad" value="${iso(parseDate(it.a.date))}"></div>
        <div class="field"><label for="c${i}-aw">Interlocuteur</label><input id="c${i}-aw" value="${esc(it.a.who)}"></div>
        <div class="field"><label for="c${i}-ar">Résultat</label>${sel(`c${i}-ar`,L.resultats,it.a.res,"—")}</div>
        <div class="field" style="grid-column:1/-1"><label for="c${i}-ac">Compte rendu</label><textarea id="c${i}-ac" style="min-height:70px">${esc(it.a.cr)}</textarea></div></div>
      <h4>Prochaine action</h4>
      <div class="two"><div class="field"><label for="c${i}-nt">Type</label>${sel(`c${i}-nt`,L.types,it.n.type,"Aucune")}</div>
        <div class="field"><label for="c${i}-nd">Date</label><input type="date" id="c${i}-nd" value="${iso(parseDate(it.n.date))}"></div>
        <div class="field"><label for="c${i}-nh">Heure</label><input type="time" id="c${i}-nh" value="${esc(it.n.time)}"></div></div>
    </div></div>`;
}
function claRead(){
  if(CLA.step!=="review")return;
  CLA.items.forEach((it,i)=>{
    const g=id=>{const el=document.getElementById(`c${i}-${id}`);return el?norm(el.value):null};
    const nm=g("name");if(nm!=null&&!it.match)it.name=nm;
    CLA_F.forEach(([k])=>{let v=g(k);if(v==null)return;if(k==="echeance"){const d=fromIso(v);v=d?fr(d):""}it.f[k]=v});
    const dd=x=>{const d=fromIso(x||"");return d?fr(d):""};
    if(g("at")!=null){it.a.type=g("at");it.a.date=dd(g("ad"))||fr(today0());it.a.who=g("aw");it.a.res=g("ar");it.a.cr=g("ac");
      it.n.type=g("nt");it.n.date=dd(g("nd"));it.n.time=g("nh")}
  });
}
function renderClaudia(){
  const root=$("#cla-root");if(!CLA.open){root.innerHTML="";return}
  const sc=root.querySelector(".panel"),top=sc?sc.scrollTop:0;
  const n=CLA.items.filter(x=>x.on).length;
  let body="",foot="";
  if(CLA.step==="in"){
    const sr=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
    body=`<div class="cla-tip"><b>Raconte ta tournée comme tu me la raconterais.</b> Pour chaque entreprise, dis si tu peux le nom et la ville, la personne rencontrée et son numéro, ce qu'ils ont aujourd'hui, ce qui les intéresse et la suite à donner. ${sr?"Touche « Dicter » ou le micro":"Touche le micro"} du clavier de ton iPhone pour parler.</div>
      <div class="field"><label for="cla-txt">Ta note</label><textarea id="cla-txt" class="cla-note" placeholder="Ex. Passé chez Garage Martin à Fréjus, vu le gérant Paul Martin au 06 12 34 56 78, copieur Canon jusqu'en juin 2027, intéressé par la téléphonie, à rappeler jeudi. Ensuite boulangerie Le Fournil à Saint-Raphaël, pas intéressés…">${esc(CLA.text)}</textarea></div>
      ${CLA.err?`<div class="err">${esc(CLA.err)}</div>`:""}`;
    foot=`${sr?`<button class="btn cla-mic ${CLA.rec?"rec":""}" type="button" data-clamic="1">${MIC}${CLA.rec?"Arrêter":"Dicter"}</button>`:""}<button class="btn cta" type="button" data-clago="1" ${norm(CLA.text).length<8?"disabled":""}>Analyser ma note</button>`;
  }else if(CLA.step==="load"){
    body=`<div class="cla-load"><span class="cla-dot">${SPARK}</span><b>Claudia lit ta note…</b><span>Elle sépare chaque entreprise, retrouve les comptes existants et prépare les relances.</span></div>`;
    foot=`<button class="btn" type="button" data-clastop="1">Annuler</button>`;
  }else if(CLA.step==="review"||CLA.step==="saving"){
    body=`<div class="cla-tip"><b>${plural(CLA.items.length,"entreprise trouvée","entreprises trouvées")}.</b> Vérifie, corrige si besoin, décoche ce que tu ne veux pas enregistrer.</div>
      ${CLA.items.map(claCard).join("")}
      ${CLA.remarks?`<div class="cla-tip"><b>Non classé · </b>${esc(CLA.remarks)}</div>`:""}
      ${CLA.err?`<div class="err">${esc(CLA.err)}</div>`:""}`;
    foot=`<button class="btn" type="button" data-claback="1" ${CLA.step==="saving"?"disabled":""}>Modifier la note</button><button class="btn cta" type="button" data-clasave="1" ${n&&CLA.step!=="saving"?"":"disabled"}>${CLA.step==="saving"?"Enregistrement…":`Tout enregistrer (${n})`}</button>`;
  }else if(CLA.step==="done"){
    const r=CLA.res||{};
    body=`<div class="cla-sum"><span class="big">✅</span><b>C'est dans ton CRM</b><span>${[r.nNew?plural(r.nNew,"compte créé","comptes créés"):"",r.nUpd?plural(r.nUpd,"fiche mise à jour","fiches mises à jour"):"",r.nAct?plural(r.nAct,"action enregistrée","actions enregistrées"):"",r.nNext?plural(r.nNext,"relance planifiée","relances planifiées"):""].filter(Boolean).join(" · ")||"Rien à enregistrer"}</span></div>`;
    foot=`<button class="btn" type="button" data-claclose="1">Fermer</button><button class="btn cta" type="button" data-clanew="1">Nouvelle note</button>`;
  }
  const still=!!sc;
  root.innerHTML=`<div class="panel-wrap${still?" still":""}" data-claclose="1"><aside class="panel" role="dialog" aria-modal="true" aria-label="Claudia, note terrain">
    <div class="panel-head"><div class="bar1"><div class="who"><span class="cla-dot" style="width:40px;height:40px;animation:none">${SPARK}</span><div class="who-t"><b style="font-family:var(--f-display);font-size:1.15rem">Claudia</b><span class="meta">Note terrain · je remplis, tu valides</span></div></div>
      <div class="actions"><button class="btn sm" type="button" data-claclose="1">Fermer</button></div></div></div>
    <div class="panel-body" style="flex:1">${body}</div>
    <div class="cla-foot">${foot}</div></aside></div>`;
  const p=root.querySelector(".panel");if(p&&CLA.step==="review")p.scrollTop=top;
}
function openClaudia(){if(!M)return;CLA.open=true;if(CLA.step==="done"){CLA.step="in";CLA.items=[]}renderClaudia();const ta=$("#cla-txt");if(ta&&!CLA.text)setTimeout(()=>ta.focus(),60)}
function claStopRec(){if(CLA.rec){try{CLA.rec.stop()}catch(e){}CLA.rec=null}}
function claMic(){
  if(CLA.rec){claStopRec();renderClaudia();return}
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;
  const ta=$("#cla-txt");CLA.text=ta?ta.value:CLA.text;
  let base=CLA.text?CLA.text.replace(/\s*$/," "):"";
  const r=new R();r.lang="fr-FR";r.continuous=true;r.interimResults=true;
  r.onresult=e=>{let fin="",tmp="";for(let k=e.resultIndex;k<e.results.length;k++){const t=e.results[k][0].transcript;if(e.results[k].isFinal)fin+=t;else tmp+=t}
    if(fin){base+=fin.trim()+" "}CLA.text=base+tmp;const el=$("#cla-txt");if(el){el.value=CLA.text;el.scrollTop=el.scrollHeight}const go=document.querySelector("[data-clago]");if(go)go.disabled=norm(CLA.text).length<8;claKeep()};
  r.onerror=e=>{CLA.rec=null;renderClaudia();if(e&&e.error&&e.error!=="aborted"&&e.error!=="no-speech")toast("Micro indisponible ici. Utilise le micro du clavier de ton iPhone.")};
  r.onend=()=>{if(CLA.rec===r){CLA.rec=null;renderClaudia()}};
  try{r.start();CLA.rec=r;renderClaudia()}catch(e){toast("Micro indisponible ici. Utilise le micro du clavier de ton iPhone.")}
}
async function claGo(){
  const ta=$("#cla-txt");if(ta)CLA.text=ta.value;claKeep();claStopRec();
  const text=norm(CLA.text);if(text.length<8)return;
  CLA.err="";CLA.step="load";const ctl=CLA.ctl=new AbortController();renderClaudia();
  try{
    const raw=await claudiaAsk(claPrompt(text.slice(0,20000)),ctl.signal);
    if(ctl.signal.aborted)return;
    const r=claParse(raw);
    if(!r.items.length)throw{message:"Claudia n'a trouvé aucune entreprise dans ta note. Précise au moins le nom de chaque société."};
    CLA.items=r.items;CLA.remarks=r.remarks;CLA.step="review";
  }catch(e){
    if(ctl.signal.aborted)return;
    CLA.step="in";
    const c=e&&e.code;
    CLA.err=c==="cancelled"?"":c==="rate_limited"?"Trop de demandes en peu de temps. Réessaie dans une minute.":(e&&e.message)||"Claudia n'a pas pu analyser ta note. Réessaie.";
  }
  CLA.ctl=null;renderClaudia();
}
async function claSaveAll(){
  claRead();CLA.err="";
  const items=CLA.items.filter(x=>x.on);if(!items.length)return;
  const all=M.ClistAll||M.Clist;
  for(const it of items){
    if(!it.name){CLA.err="Une des fiches n'a pas de nom de société.";return renderClaudia()}
    if(!it.match&&all.some(c=>low(c.name)===low(it.name))){it.match=all.find(c=>low(c.name)===low(it.name)).name}
    if(it.n.type&&!it.n.date){CLA.err=`Choisis la date de la prochaine action pour ${it.name}.`;return renderClaudia()}
  }
  CLA.step="saving";renderClaudia();
  const res={nNew:0,nUpd:0,nAct:0,nNext:0};
  try{
    const fresh=await getRange(C_RANGE);let last=-1;fresh.forEach((r,i)=>{if(norm(r[0]))last=i});let crow=last+4;
    let jrow=await nextFreeJournalRow();
    for(const it of items){
      const f=it.f;
      if(!it.match){
        const vis=it.a.type==="Visite physique"?it.a.date:"";
        await setRange(`Comptes!A${crow}:O${crow}`,[[it.name,f.secteur,f.ville,f.adresse,vis,f.contact,f.fonction,telOut(f.tel),f.email,f.besoin,f.presta,f.echeance,f.prio,f.statut||"À qualifier",f.comment]]);
        await setRange(`Comptes!W${crow}:Z${crow}`,[["","","",USER]]);crow++;res.nNew++;
      }else{
        const c=all.find(x=>x.name===it.match);
        const raw=(fresh[c.row-3]||[]).slice(0,15).map(x=>x==null?"":String(x));while(raw.length<15)raw.push("");
        let ch=false;
        for(const k in CLA_COL){const j=CLA_COL[k];let v=f[k];if(!v)continue;
          if(k==="tel"){if(v.replace(/\D/g,"")===raw[j].replace(/\D/g,""))continue}
          else if(low(v)===low(raw[j]))continue;
          if(k==="comment"&&raw[j])v=raw[j]+"\n"+fr(today0())+" · "+v;
          raw[j]=v;ch=true}
        if(ch){raw[7]=telOut(raw[7]);await setRange(`Comptes!B${c.row}:O${c.row}`,[raw.slice(1)]);res.nUpd++}
      }
      if(it.a.type||it.n.type){
        await setRange(`'Journal (base)'!A${jrow}:K${jrow}`,[[it.a.type?it.a.date:fr(today0()),it.name,it.a.who,it.a.type,it.a.cr,it.a.type?it.a.res:"",it.n.type,it.n.type?it.n.date:"",it.n.type?it.n.time:"",!!it.a.type,USER]]);
        jrow++;if(it.a.type)res.nAct++;if(it.n.type)res.nNext++;
      }
      it.on=false;it.saved=true;
    }
    CLA.res=res;CLA.step="done";CLA.text="";claKeep();renderClaudia();if(!RM)confetti();
  }catch(e){
    const left=CLA.items.filter(x=>x.on).length;CLA.items.forEach(x=>{if(!x.saved&&items.includes(x))x.on=true});
    CLA.step="review";CLA.err=errorCopy(e,true).join(". ")+(res.nNew+res.nUpd+res.nAct?` Déjà enregistré · ${res.nNew+res.nUpd} fiche(s), ${res.nAct} action(s). Les entreprises encore cochées restent à enregistrer.`:"");
    CLA.items=CLA.items.filter(x=>!x.saved);renderClaudia();
  }
  load(false,true);
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-openclaudia]")){e.preventDefault();if(CHAT.open){CHAT.open=false;renderChat()}openClaudia();return}
  if(!CLA.open)return;
  if(e.target.matches("[data-claclose]")){if(CLA.step==="saving")return;claRead();claStopRec();if(CLA.ctl)CLA.ctl.abort();const ta=$("#cla-txt");if(ta){CLA.text=ta.value;claKeep()}CLA.open=false;renderClaudia();return}
  if(e.target.closest("[data-clamic]")){claMic();return}
  if(e.target.closest("[data-clago]")){claGo();return}
  if(e.target.closest("[data-clastop]")){if(CLA.ctl)CLA.ctl.abort();CLA.ctl=null;CLA.step="in";renderClaudia();return}
  if(e.target.closest("[data-claback]")){claRead();CLA.step="in";CLA.err="";renderClaudia();return}
  if(e.target.closest("[data-clasave]")){claSaveAll();return}
  if(e.target.closest("[data-clanew]")){CLA.step="in";CLA.items=[];CLA.text="";CLA.err="";renderClaudia();return}
  const fu=e.target.closest("[data-clafull]");if(fu){claRead();CLA.items[+fu.dataset.clafull].full=true;renderClaudia();return}
});
document.addEventListener("change",e=>{
  if(!CLA.open)return;
  const on=e.target.closest("[data-claon]");if(on){claRead();CLA.items[+on.dataset.claon].on=on.checked;renderClaudia();return}
  const m=e.target.closest("[data-clamatch]");if(m){claRead();const it=CLA.items[+m.dataset.clamatch];it.match=m.value;if(m.value)it.name=m.value;renderClaudia();return}
});
document.addEventListener("input",e=>{if(e.target.id==="cla-txt"){CLA.text=e.target.value;claKeep();const go=document.querySelector("[data-clago]");if(go)go.disabled=norm(CLA.text).length<8}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&CLA.open&&CLA.step!=="saving"){claRead();claStopRec();CLA.open=false;renderClaudia()}});

/* ---------- web : connexion, réglages, GPS ---------- */
function showSetup(err,draft){
  const dv=draft||CFG||{};
  $("#fab").hidden=true;$("#tabs-top").innerHTML="";$("#tabs-bottom").innerHTML="";
  $("#app").innerHTML=`<div class="card" style="max-width:480px;margin:20px auto;gap:14px">
    <div class="who"><span class="av" style="--h:12;width:46px;height:46px">DF</span><div class="who-t"><h2 style="margin:0;font-family:var(--f-display)">Connexion à DealFlow</h2><span class="mail">À faire une seule fois sur cet appareil</span></div></div>
    <div class="field"><label for="cfg-url">Lien de ton API Google (se termine par /exec)</label><input id="cfg-url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(dv.url||"")}"></div>
    <div class="field"><label for="cfg-tok">Code secret</label><input id="cfg-tok" autocomplete="off" placeholder="df-…" value="${esc(dv.token||"")}"></div>
    ${err?`<div class="err">${esc(err)}</div>`:""}
    <button class="btn primary" type="button" id="cfg-go">Se connecter</button>
  </div>`;
  $("#cfg-go").onclick=async()=>{
    const url=norm($("#cfg-url").value).replace(/\?.*$/,""),token=norm($("#cfg-tok").value);
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url))return showSetup("Le lien doit commencer par https://script.google.com/ et finir par /exec.",{url,token});
    if(!token)return showSetup("Entre ton code secret.",{url,token});
    CFG={url,token};$("#cfg-go").disabled=true;$("#cfg-go").textContent="Vérification…";
    try{await getRange("Listes!I2");try{localStorage.setItem("df-cfg",JSON.stringify(CFG))}catch(e){};mcp=true;startGeo();showAiButtons();render();load()}
    catch(e){CFG=null;showSetup(e.code==="badtoken"?"Code secret incorrect.":e.message||"Connexion impossible.",{url,token})}
  };
}
let GEO=false;
function startGeo(){
  if(GEO||!navigator.geolocation)return;GEO=true;
  try{navigator.geolocation.watchPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude],first=!S_T.me||S_T.meLabel!=="Ta position";
    S_T.me=ll;S_T.meLabel="Ta position";S_T.askCity=false;
    if(S_T.meMk&&MAP){try{S_T.meMk.setLatLng(ll)}catch(e){}}
    if(first){if(!S_T.center){S_T.center=ll;S_T.zoom=13}if(S.view==="terrain"&&!document.querySelector("#modal-root .overlay")){if(MAP){try{MAP.remove()}catch(e){}MAP=null}render()}}
  },()=>{},{enableHighAccuracy:true,maximumAge:20000,timeout:30000})}catch(e){}
}
document.addEventListener("click",e=>{if(e.target.closest("[data-settings]")){showSetup()}});
/* ---------- boot ---------- */
const h=(location.hash||"").slice(1);
try{const cc=JSON.parse(localStorage.getItem("df-cache")||"null");if(cc&&cc.j&&cc.c){S.journal=cc.j;S.comptes=cc.c;if(cc.L)L=cc.L;S.objectif=cc.o||0;S.users=cc.u||[];S.me=cc.me||null;applyMe();S.loaded=true;S.cached=true;S.fetchedAt=new Date(cc.t)}}catch(e){}
if(VIEWS.some(v=>v[0]===h))S.view=h;else{try{const s=localStorage.getItem("cp-view");if(VIEWS.some(v=>v[0]===s))S.view=s}catch(e){}}
render();
(async()=>{
  if(!CFG){showSetup();return}
  mcp=true;startGeo();showAiButtons();
  load();
})();
})();
</script>
