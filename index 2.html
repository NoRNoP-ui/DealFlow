<style>:root{color-scheme:light}html{background:#14213D}body{min-height:100vh}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* DealFlow — app shell. Gradient brand band (nuit → prune) carrying logo + tabs, bottom tab bar on phone, cards on a cool grey ground. Couleurs : mer (primaire), corail (action), soleil, menthe, violet. Chaque statut et chaque type d'action a sa couleur. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface-2:#F5F8FA; --ink:#0F1E2B; --muted:#5A6B78; --line:#DBE3E9;
  --brand-1:#14213D; --brand-2:#14213D; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.72);
  --sea:#0B6E8A; --sea-soft:#DDF0F5; --coral:#E8574C; --coral-soft:#FDE7E4; --sun:#C98410; --sun-soft:#FCF0D9;
  --mint:#1E9A6E; --mint-soft:#DDF3EA; --violet:#6A4FD1; --violet-soft:#ECE7FB; --sky:#2C6CD1; --sky-soft:#E3ECFB;
  --pink:#C2417F; --pink-soft:#FBE5EF; --slate:#56677A; --slate-soft:#E7ECF1;
  --accent:#0B6E8A; --accent-ink:#FFFFFF; --cta:#FF5A47; --cta-ink:#FFFFFF;
  --late:#D23A2F; --late-soft:#FCE6E3; --today:#B87308; --today-soft:#FCEFD6; --week:#2C6CD1; --week-soft:#E3ECFB; --done:#1E9A6E; --done-soft:#DDF3EA;
  --av-l:90%; --av-s:60%; --av-ink:28%;
  --shadow:0 1px 2px rgba(15,30,43,.06),0 6px 18px rgba(15,30,43,.06);
  --sea-map:#CFE6EF; --land:#F4F1EA; --land-line:#C9D6DD; --land-ink:#4B5B66;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea-map:#0E2633; --land:#1B2832; --land-line:#2F4350; --land-ink:#B5C4CE; --bg:#0C141B; --surface:#141F28; --surface-2:#1A2731; --ink:#E6EEF3; --muted:#93A4B1; --line:#263744;
  --brand-1:#0E1830; --brand-2:#0E1830; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.7);
  --sea:#4CC0DB; --sea-soft:#123744; --coral:#FF8378; --coral-soft:#3D1F1D; --sun:#F2C063; --sun-soft:#3A2E16;
  --mint:#5ED3A5; --mint-soft:#143428; --violet:#A893F5; --violet-soft:#2A2350; --sky:#86AEF5; --sky-soft:#1B2A47;
  --pink:#F08DBB; --pink-soft:#3D1D2D; --slate:#A6B5C3; --slate-soft:#22313D;
  --accent:#4CC0DB; --accent-ink:#06171D; --cta:#FF7468; --cta-ink:#1E0806;
  --late:#FF8378; --late-soft:#3D1F1D; --today:#F2C063; --today-soft:#3A2E16; --week:#86AEF5; --week-soft:#1B2A47; --done:#5ED3A5; --done-soft:#143428;
  --av-l:24%; --av-s:40%; --av-ink:86%; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --sea-map:#0E2633; --land:#1B2832; --land-line:#2F4350; --land-ink:#B5C4CE; --bg:#0C141B; --surface:#141F28; --surface-2:#1A2731; --ink:#E6EEF3; --muted:#93A4B1; --line:#263744;
  --brand-1:#0E1830; --brand-2:#0E1830; --on-brand:#FFFFFF; --on-brand-muted:rgba(255,255,255,.7);
  --sea:#4CC0DB; --sea-soft:#123744; --coral:#FF8378; --coral-soft:#3D1F1D; --sun:#F2C063; --sun-soft:#3A2E16;
  --mint:#5ED3A5; --mint-soft:#143428; --violet:#A893F5; --violet-soft:#2A2350; --sky:#86AEF5; --sky-soft:#1B2A47;
  --pink:#F08DBB; --pink-soft:#3D1D2D; --slate:#A6B5C3; --slate-soft:#22313D;
  --accent:#4CC0DB; --accent-ink:#06171D; --cta:#FF7468; --cta-ink:#1E0806;
  --late:#FF8378; --late-soft:#3D1F1D; --today:#F2C063; --today-soft:#3A2E16; --week:#86AEF5; --week-soft:#1B2A47; --done:#5ED3A5; --done-soft:#143428;
  --av-l:24%; --av-s:40%; --av-ink:86%; --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--brand-1);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-1)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:0;z-index:5;background:var(--brand-1);color:var(--on-brand);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{padding-block:16px 0;display:flex;flex-direction:column;gap:10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt b em{font-style:normal;color:#FFB13B}
.brand-txt b{font-family:var(--f-display);font-weight:800;font-size:1.22rem;letter-spacing:-.01em;line-height:1.05}
.brand-txt span{font-size:.72rem;color:var(--on-brand-muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refresh{display:flex;align-items:center;gap:8px;color:var(--on-brand-muted);font-size:.78rem}
@media (max-width:480px){#updated{display:none}
#reload{display:inline-flex;align-items:center;gap:6px}#reload .ic{flex:none}
@media (min-width:761px){#reload .ic{display:none}}
#card-top{display:inline-flex;align-items:center;justify-content:center;line-height:0}}
/* ---- mobile : affichage adapté et zoom bloqué hors carte ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation}
@media (max-width:760px){
  input,select,textarea{font-size:16px!important}
  .row1{gap:8px}
  .brand svg{width:34px;height:34px}
  .refresh{gap:6px}
  .ai-btn{padding:7px 11px;font-size:.8rem}
  #card-top,#reload{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;line-height:0}
  #reload .lbl{display:none}
  .fab{width:58px!important;height:58px!important;padding:0!important;border-radius:50%!important;font-size:0!important;color:transparent!important;overflow:hidden}
  .fab::before,.fab::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:3.5px;margin:-1.75px 0 0 -12px;border-radius:3px;background:#fff}
  .fab::after{transform:rotate(90deg)}
  #app{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
  .scope button{padding:6px 11px;font-size:.78rem}
  .scope span{display:none}
  .panel-head .pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-right:-16px;padding-right:16px}
  .panel-head .pills::-webkit-scrollbar{display:none}
  .panel-head .pills .pill{flex:none}
  .panel-head .btn{white-space:nowrap}
}
.btn-ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--on-brand);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.8rem}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.btn-ghost[disabled]{opacity:.6}
.tabs-top{display:none;gap:2px}
.tab{background:none;border:0;padding:10px 14px 12px;font-weight:700;font-size:.9rem;color:var(--on-brand-muted);display:inline-flex;gap:6px;align-items:center;border-bottom:3px solid transparent}
.tabs-top .tab[aria-current="page"]{color:var(--on-brand);border-bottom-color:var(--cta)}
.tabs-top .tab:hover{color:var(--on-brand)}
.bdg{font-size:.68rem;background:var(--cta);color:var(--cta-ink);border-radius:999px;padding:1px 6px;font-variant-numeric:tabular-nums;font-weight:800}
.spacer-b{height:10px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(15,30,43,.06)}
nav.bottom .tab{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 2px;justify-content:center;position:relative;color:var(--muted);border:0}
nav.bottom .tab svg{width:23px;height:23px}
nav.bottom .tab[aria-current="page"]{color:var(--accent)}
nav.bottom .tab[aria-current="page"] svg{stroke-width:2.3}
nav.bottom .tab .bdg{position:absolute;top:1px;left:calc(50% + 6px)}
@media (min-width:760px){.tabs-top{display:flex} nav.bottom{display:none} .spacer-b{display:none} .fab{bottom:calc(env(safe-area-inset-bottom,0px) + 24px)!important}}

main{display:block;background:var(--bg);min-height:100vh;min-height:100dvh}
main .wrap{padding-block:18px 160px;display:flex;flex-direction:column;gap:22px}
.hello{display:flex;flex-direction:column;gap:2px}
.hello h1{font-family:var(--f-display);font-size:1.7rem;font-weight:800;margin:0;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
.hello p{margin:0;color:var(--muted);font-weight:500}
.hello p b{color:var(--ink)}
section.group{display:flex;flex-direction:column;gap:10px}
.g-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.g-head h2{font-family:var(--f-display);font-weight:800;font-size:1.08rem;margin:0}
.g-head span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.g-head .lnk{margin-left:auto;background:none;border:0;color:var(--accent);font-weight:700;font-size:.85rem;padding:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{--c:var(--sea);--cs:var(--sea-soft);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 13px;display:flex;flex-direction:column;gap:4px;text-align:left;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--cs)}
.kpi .ic{width:30px;height:30px;border-radius:9px;background:var(--cs);color:var(--c);display:grid;place-items:center;position:relative;z-index:1}
.kpi .ic svg{width:17px;height:17px}
.kpi b{font-family:var(--f-display);font-size:1.95rem;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c);position:relative;z-index:1}
.kpi span{color:var(--muted);font-size:.8rem;font-weight:700;position:relative;z-index:1}
button.kpi:hover{border-color:var(--c)}
.k-coral{--c:var(--coral);--cs:var(--coral-soft)} .k-sun{--c:var(--sun);--cs:var(--sun-soft)} .k-mint{--c:var(--mint);--cs:var(--mint-soft)}
.k-violet{--c:var(--violet);--cs:var(--violet-soft)} .k-sky{--c:var(--sky);--cs:var(--sky-soft)} .k-pink{--c:var(--pink);--cs:var(--pink-soft)} .k-slate{--c:var(--slate);--cs:var(--slate-soft)}

.cta-band{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--brand-1);color:var(--on-brand);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.cta-band div{flex:1;min-width:180px}
.cta-band.mail-band{background:#3B2A7A}
.panel-head .actions{flex-wrap:wrap;justify-content:flex-end}
.cta-band b{font-family:var(--f-display);font-size:1.1rem;display:block}
.cta-band span{color:var(--on-brand-muted);font-size:.85rem}
.btn-cta{background:var(--cta);color:var(--cta-ink);border:0;border-radius:11px;padding:11px 16px;font-weight:800;font-size:.92rem}
.btn-cta[disabled]{opacity:.5}

.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 15px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--line);min-width:0}
.task.late{border-left-color:var(--late)} .task.today{border-left-color:var(--today)} .task.week{border-left-color:var(--week)} .task.later{border-left-color:var(--slate-soft)}
.task.done{border-left-color:var(--done);box-shadow:none;background:var(--surface-2)}
.task.done .co-btn{text-decoration:line-through;text-decoration-color:var(--muted)}
.t-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.when{font-weight:800;font-size:.78rem;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.late .when,.when.late{background:var(--late-soft);color:var(--late)} .today .when,.when.today{background:var(--today-soft);color:var(--today)}
.week .when,.when.week{background:var(--week-soft);color:var(--week)} .done .when{background:var(--done-soft);color:var(--done)}
.ty{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;background:var(--cs);color:var(--c)}
.ty svg{width:13px;height:13px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{--h:200;width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 55% var(--av-ink))}
.co-btn{background:none;border:0;padding:0;text-align:left;font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.co-btn:hover{color:var(--accent)}
.who-t{display:flex;flex-direction:column;min-width:0;gap:1px}
.meta{color:var(--muted);font-size:.83rem;display:flex;gap:2px 10px;flex-wrap:wrap;align-items:center}
.contact-line{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.num{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.num span{user-select:all}
.num a{color:var(--mint);text-decoration:none;font-weight:800;font-size:.76rem;background:var(--mint-soft);padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.num a svg{width:12px;height:12px}
.copy{background:none;border:0;color:var(--muted);font-size:.74rem;font-weight:700;padding:2px 4px}
.copy:hover{color:var(--accent)}
.mail{font-size:.84rem;color:var(--muted);word-break:break-all;user-select:all}
.note{margin:0;font-size:.87rem;background:var(--surface-2);border-radius:9px;padding:8px 10px;overflow-wrap:anywhere}
.note b{color:var(--muted);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
.btn{border-radius:10px;padding:9px 14px;font-weight:700;font-size:.87rem;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.cta{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.btn.danger{color:var(--late);border-color:var(--late-soft)}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:progress}

.st{--c:var(--slate);--cs:var(--slate-soft);font-size:.74rem;font-weight:800;color:var(--c);background:var(--cs);padding:3px 9px;border-radius:999px;white-space:nowrap}
.s0{--c:var(--slate);--cs:var(--slate-soft)} .s1{--c:var(--sky);--cs:var(--sky-soft)} .s2{--c:var(--violet);--cs:var(--violet-soft)}
.s3{--c:var(--sea);--cs:var(--sea-soft)} .s4{--c:var(--sun);--cs:var(--sun-soft)} .s5{--c:var(--pink);--cs:var(--pink-soft)}
.s6{--c:var(--mint);--cs:var(--mint-soft)} .s7{--c:var(--coral);--cs:var(--coral-soft)} .s8{--c:var(--slate);--cs:var(--slate-soft)}

details.more>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"Afficher";margin-left:auto;font-size:.82rem;font-weight:700;color:var(--accent)}
details.more[open]>summary::after{content:"Masquer"}
details.more .list{display:flex;flex-direction:column;gap:10px;margin-top:10px}

.toolbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow)}
.search select{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px;max-width:46%}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:700;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill small{opacity:.75;font-variant-numeric:tabular-nums;margin-left:4px}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.crow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow .av{grid-row:1/3}
.crow .nm{font-weight:800;font-size:.98rem;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.crow .sub{grid-column:2/4;color:var(--muted);font-size:.82rem;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.prio{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.prio.Chaud{background:var(--coral)} .prio.Tiède{background:var(--sun)} .prio.Froid{background:var(--sky)}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 255px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:10px;min-width:0}
.col h3{margin:0;font-family:var(--f-display);font-size:.95rem;display:flex;justify-content:space-between;gap:8px;color:var(--c)}
.col h3 span{background:var(--cs);border-radius:999px;padding:0 8px;font-variant-numeric:tabular-nums}

.cla-b{display:flex;flex-direction:column;gap:10px}
.cla-b h4{margin:6px 0 -2px;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.cla-was{font-size:.75rem;color:var(--muted)}
.cla-sum{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 10px}
.cla-sum .big{font-size:2.6rem}
.cla-sum b{font-family:var(--f-display);font-size:1.3rem}
.cla-load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 10px;color:var(--muted);text-align:center}
.cla-dot{width:54px;height:54px;border-radius:50%;background:linear-gradient(120deg,#14213D,#2B3F8F);display:grid;place-items:center;color:#fff;animation:claP 1.2s ease-in-out infinite}
.cla-dot svg{width:26px;height:26px}
@keyframes claP{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.cla-dot{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 142px);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.88rem;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
/* assistant */
.ai-btn{display:inline-flex;align-items:center;gap:6px;background:var(--cta);color:#fff;border:0;border-radius:999px;padding:7px 13px;font-weight:800;font-size:.82rem;box-shadow:0 4px 14px rgba(255,61,110,.35)}
.ai-btn svg{width:16px;height:16px}
.ai-fab{position:fixed;right:max(19px,calc(env(safe-area-inset-right,0px) + 19px));bottom:calc(env(safe-area-inset-bottom,0px) + 148px);z-index:6;width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--cta);color:#fff;box-shadow:0 8px 22px rgba(255,61,110,.38)}
.ai-fab svg{width:24px;height:24px}
@media (min-width:760px){.ai-fab{display:none}}
.chat{background:var(--bg);width:100%;max-width:560px;height:100%;display:flex;flex-direction:column}
.chat-log{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--shadow)}
.msg.a.err{border-color:var(--late-soft);color:var(--late)}
.msg .think{color:var(--muted);font-style:italic}
.msg-acts{align-self:flex-start;display:flex;flex-direction:column;gap:6px;max-width:88%}
.act-chip{display:flex;align-items:center;gap:8px;background:var(--mint-soft);color:var(--mint);border-radius:10px;padding:7px 10px;font-size:.82rem;font-weight:700}
.act-chip.undone{background:var(--slate-soft);color:var(--slate);text-decoration:line-through}
.act-chip button{margin-left:auto;background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;font-size:.8rem}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.8rem;font-weight:700;text-align:left}
.chat-in{display:flex;gap:8px;align-items:flex-end;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.chat-in textarea{flex:1;min-width:0;resize:none;max-height:140px;min-height:44px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.chat-in button{flex:none;height:44px;border-radius:14px;border:0;padding:0 16px;font-weight:800;background:var(--cta);color:var(--cta-ink)}
.chat-in button.stop{background:var(--ink);color:var(--bg)}
.chat-empty{color:var(--muted);text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.chat-empty b{font-family:var(--f-display);font-size:1.15rem;color:var(--ink)}

/* terrain */
.map-wrap{position:relative;isolation:isolate;z-index:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
#map{height:min(76vh,760px);min-height:380px;background:var(--sea-map)}
.map-wrap.full{position:fixed;inset:0;z-index:14;border-radius:0;border:0}
.map-wrap.full #map{height:100%;min-height:0}
.map-tools{position:absolute;z-index:500;top:max(10px,env(safe-area-inset-top,0px));right:10px;display:flex;flex-direction:column;gap:8px}
.map-tools button{border:0;border-radius:12px;background:var(--surface);color:var(--ink);font-weight:800;font-size:.8rem;padding:9px 12px;box-shadow:0 2px 10px rgba(15,30,43,.2);display:flex;align-items:center;gap:6px}
.map-tools button.on{background:var(--sky);color:#fff}
.me-dot{width:18px;height:18px;border-radius:50%;background:#2C6CD1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(44,108,209,.25)}
.near{display:flex;flex-direction:column;gap:8px}
.near .rows .crow .nm::after{content:attr(data-km);margin-left:auto;font-size:.78rem;font-weight:800;color:var(--sky);white-space:nowrap}
.pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pick select{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px}
.leaflet-container{font-family:var(--f-body);background:var(--sea-map)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:14px}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:12px 14px;min-width:220px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.leaflet-popup-content b.t{font-family:var(--f-display);font-size:1.05rem}
.leaflet-popup-content .actions{gap:6px}
.leaflet-popup-content .actions a,.leaflet-popup-content .actions button{text-decoration:none;color:inherit}
.town-lbl{font-family:var(--f-display);font-weight:800;font-size:11px;color:var(--land-ink);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
/* ---------- terrain V2 : carte claire et ergonomique ---------- */
.mv{position:relative;height:var(--mvh,560px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));overflow:hidden;background:#F2EFE9;isolation:isolate}
.mv[data-mt="dark"]{background:#111B30}
@media (min-width:760px){.mv{margin:0;border-radius:20px;box-shadow:var(--shadow)}}
.mv.full{position:fixed;inset:0;z-index:40;height:auto;margin:0;border-radius:0}
body.mv-fs{overflow:hidden}
.mv #map{position:absolute;inset:0;z-index:0;height:auto;min-height:0;background:transparent}
.mv .maplibregl-ctrl-attrib{font-size:10px}
.mv .maplibregl-ctrl-bottom-right,.mv .leaflet-bottom.leaflet-right{bottom:var(--sh,176px)}
.mv-sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.mv-top{position:absolute;z-index:5;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.mv.full .mv-top{top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px))}
.mv-top>*{pointer-events:auto}
.mv-search{height:48px;background:var(--surface);color:var(--muted);border-radius:16px;box-shadow:0 6px 20px rgba(20,33,61,.14);display:flex;align-items:center;gap:10px;padding:0 4px 0 14px}
.mv-search>svg{width:20px;height:20px;flex:none}
.mv-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;font-weight:600;color:var(--ink);-webkit-appearance:none;appearance:none;padding:0}
.mv-search input::-webkit-search-cancel-button{display:none}
.mv-search input::placeholder{color:var(--muted);opacity:.9}
.mv-clr{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--muted);flex:none}
.mv-clr svg{width:18px;height:18px}
.mv-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-right:-12px;padding:0 12px 4px 0}
.mv-chips::-webkit-scrollbar{display:none}
.mv-chips.in{margin:0;padding:0 0 2px}
.mv-chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;line-height:1;border-radius:999px;padding:8px 12px;white-space:nowrap;box-shadow:0 2px 8px rgba(20,33,61,.08)}
.mv-chip svg{width:15px;height:15px}
.mv-chip[aria-pressed="true"]{background:#14213D;color:#fff;border-color:#14213D}
.mv-chip.mv-tc[aria-pressed="true"]{background:#FF5A47;border-color:#FF5A47}
.mv-chips.in .mv-chip{box-shadow:none}
.mv-ctl{position:absolute;z-index:5;right:12px;bottom:calc(var(--sh,176px) + 12px);display:flex;flex-direction:column;gap:10px;transition:bottom .2s ease}
.mv.full .mv-ctl{right:max(12px,env(safe-area-inset-right,0px))}
.mv-btn{width:46px;height:46px;border-radius:50%;background:var(--surface);border:0;box-shadow:0 4px 14px rgba(20,33,61,.2);display:grid;place-items:center;padding:0;color:var(--ink)}
.mv-btn svg{width:21px;height:21px}
.mv-btn.me{color:#2C7BE5}
.mv-btn.me.on{background:#2C7BE5;color:#fff}
.mv-sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -8px 26px rgba(20,33,61,.16);display:flex;flex-direction:column;max-height:calc(100% - 112px)}
.mv-sheet[data-s="peek"]{height:var(--peek,178px)}
.mv-sheet[data-s="full"]{height:calc(100% - 112px)}
.mv-sheet[data-s="fit"]{height:auto}
.mv-sheet[data-s="mid"]{height:min(54%,calc(100% - 112px))}
.mv.full .mv-sheet .mv-body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.mv-grab{flex:none;padding:8px 18px 4px;touch-action:none;cursor:pointer}
.mv-grab i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.mv-body>*{flex-shrink:0}
.mv-body{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.mv-sheet[data-s="peek"] .mv-body{overflow:hidden}
.mv-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex:none}
.mv-seg button{border:0;background:transparent;border-radius:9px;padding:7px 4px;font-weight:800;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px rgba(20,33,61,.14)}
.mv-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex:none}
.mv-h b{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.15;min-width:0}
.mv-h span{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.mv-h.mv-hc{flex-direction:column;align-items:flex-start;gap:2px}
.mv-h.mv-hc span{white-space:normal;font-weight:600;font-size:13px}
.mv-h .lnk{font-size:14px;font-weight:800}
.mv-rows{display:flex;flex-direction:column;gap:8px}
.mv-row{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:0;border-radius:14px;padding:10px 12px;text-align:left;width:100%;color:inherit;font:inherit}
.mv-row.disc{padding:6px 8px 6px 4px}
.mv-row.flash{animation:mvFlash 1.2s ease}
@keyframes mvFlash{0%,40%{box-shadow:0 0 0 2px #2C7BE5}100%{box-shadow:0 0 0 0 transparent}}
.mv-dl{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:4px 6px;text-align:left;color:inherit;font:inherit}
.mv-ic{width:34px;height:34px;border-radius:10px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px;line-height:1}
.mv-ic.g{background:var(--slate-soft);color:var(--slate)}
.mv-rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mv-rt b{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-rt small{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-d{font-weight:800;font-size:13px;white-space:nowrap}
.mv-add{border:0;background:#14213D;color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:9px 12px;white-space:nowrap;flex:none}
.mv-more{border:1px dashed var(--line);background:none;border-radius:12px;padding:11px;font-weight:800;font-size:14px;color:var(--accent)}
.mv-note{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.mv-note select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.mv-tourbar{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:10px 14px;background:#14213D;color:#fff;text-align:left;font:inherit;flex:none}
.mv-tourbar>svg{width:22px;height:22px;flex:none;color:#FFB13B}
.mv-tourbar span{flex:1;display:flex;flex-direction:column;gap:1px}
.mv-tourbar b{font-weight:800;font-size:15px}
.mv-tourbar small{font-size:12px;font-weight:600;color:#A9B6D3}
.mv-tourbar i{font-style:normal;font-size:22px;line-height:1;color:#A9B6D3}
/* fiche rapide */
.mv-fh{display:flex;gap:12px;align-items:flex-start}
.mv-big{width:48px;height:48px;border-radius:14px;color:#fff;font-family:var(--f-display);font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;line-height:1}
.mv-ft{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mv-name{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.12}
.mv-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.mv-x{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
.mv-x svg{width:18px;height:18px}
.mv-lines{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:600}
.mv-lines>span{display:flex;gap:8px;align-items:flex-start}
.mv-lines svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted)}
.mv-lines em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}
.mv-lines em.ok{color:var(--mint)}
.mv-next{background:var(--today-soft);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;color:var(--ink)}
.mv-next b{font-size:12px;font-weight:800;color:var(--today)}
.mv-next b.late{color:var(--late)}
.mv-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mv-acts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.mv-more[disabled]{opacity:.6}
.mv-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;border-radius:16px;padding:12px 4px;font-weight:800;font-size:13px;line-height:1.1;color:#fff;min-height:74px;text-decoration:none;font-family:inherit;text-align:center}
.mv-act svg{width:22px;height:22px;flex:none}
.mv-act.call{background:#1E9A6E}.mv-act.go{background:#2C7BE5}.mv-act.visit{background:#FF5A47}.mv-act.cla{background:#14213D}
.mv[data-mt="dark"] .mv-act.cla,:root[data-theme="dark"] .mv-act.cla{background:#2B3B60}
.mv-act[aria-disabled="true"]{opacity:.45}
.mv-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mv-nav a{border-radius:12px;padding:12px 4px;font-weight:800;font-size:13px;color:#fff;background:#14213D;text-align:center;text-decoration:none}
.mv-nav a.wz{background:#FF5A47}
.mv-links{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mv-links .lnk{font-size:14px;font-weight:800;padding:6px 0}
/* tournée */
.mv-tour{background:#14213D;color:#fff;border-radius:18px;padding:13px 15px;display:flex;flex-direction:column;gap:10px;flex:none}
.mv-tour .mv-h span{color:#A9B6D3}
.mv-tour .lnk{color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:12px}
.mv-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mv-stats b{font-family:var(--f-display);font-weight:800;font-size:21px;display:block;line-height:1.1;white-space:nowrap}
.mv-stats span{font-size:11px;font-weight:700;color:#A9B6D3}
.mv-save{font-size:12px;font-weight:700;color:#FFB13B}
.mv-stop{border:1.5px solid var(--line);border-radius:18px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;flex:none}
.mv-stop small{font-size:13px;font-weight:600;color:var(--muted)}
.mv-k{font-size:12px;font-weight:800;color:#FF5A47}
.mv-ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mv-ol li{display:flex;align-items:center;gap:10px}
.mv-n{width:28px;height:28px;border-radius:50%;border:2.5px solid #FF5A47;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;line-height:1;flex:none}
.mv-n.nx{background:#FF5A47;color:#fff}
.mv-n.ok{background:#1E9A6E;border-color:#1E9A6E;color:#fff}
.mv-n svg{width:15px;height:15px}
.mv-ot{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:1px;padding:6px 0;color:inherit;font:inherit}
.mv-ot b{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-ot small{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-rm{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;padding:0;flex:none}
.mv-rm svg{width:15px;height:15px}
.mv-gm{display:block;text-align:center;border-radius:14px;background:#FF5A47;color:#fff;font-weight:800;font-size:15px;padding:14px;text-decoration:none}
/* marqueurs */
.mv-pin{border:0;background:none;padding:0;display:block;cursor:pointer;line-height:0;filter:drop-shadow(0 3px 4px rgba(20,33,61,.32))}
.mv-pin svg{display:block;overflow:visible}
.mv-pin .pulse{transform-box:fill-box;transform-origin:center;animation:mvPulse 1.8s ease-out infinite}
@keyframes mvPulse{0%{transform:scale(.7);opacity:.95}100%{transform:scale(2);opacity:0}}
.mv-cl{border-radius:50%;background:#14213D;color:#fff;border:3px solid #fff;box-shadow:0 4px 12px rgba(20,33,61,.32);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;padding:0;line-height:1;font-family:var(--f-body)}
.mv-cl.hot{box-shadow:0 0 0 3px #FF5A47,0 4px 12px rgba(20,33,61,.32)}
.mv-me{width:22px;height:22px;border-radius:50%;background:#2C7BE5;border:4px solid #fff;box-shadow:0 0 0 10px rgba(44,123,229,.2),0 2px 6px rgba(0,0,0,.25);pointer-events:none}
.mv[data-mt="dark"] .mv-me{background:#4F9BFF;box-shadow:0 0 0 10px rgba(79,155,255,.22),0 2px 6px rgba(0,0,0,.4)}
.mv-stopn{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid #FF5A47;color:#14213D;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.35);padding:0;line-height:1;font-family:var(--f-body)}
.mv-stopn.nx{background:#FF5A47;color:#fff;border-color:#fff}
.mv-stopn.ok{background:#1E9A6E;color:#fff;border-color:#fff}
.mv-stopn svg{width:14px;height:14px}
.mv-disc{width:16px;height:16px;border-radius:50%;background:#8C99A6;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);padding:0}
.mv-disc.sel{background:#14213D;transform:scale(1.35)}
.mv-town{font-family:var(--f-body);font-weight:700;font-size:11px;color:#5A5650;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;white-space:nowrap;pointer-events:none;letter-spacing:.02em;transform:translate(-50%,-50%)}
.mv[data-mt="dark"] .mv-town{color:#8FA2C9;text-shadow:0 0 3px #0E172B,0 0 3px #0E172B}
.leaflet-marker-icon .mv-town{transform:none}
/* arrivée */
.mv-arr{position:absolute;inset:0;z-index:9;background:rgba(20,33,61,.3);display:flex;align-items:flex-end;animation:rwFade .2s ease both}
.mv-ac{width:100%;background:var(--surface);color:var(--ink);border-radius:26px 26px 0 0;padding:4px 20px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:13px;box-shadow:0 -12px 34px rgba(20,33,61,.25);animation:mvUp .3s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes mvUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.mv-ah{display:flex;align-items:center;gap:12px}
.mv-ah>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mv-ai{width:46px;height:46px;border-radius:50%;background:var(--coral-soft);color:#FF5A47;display:grid;place-items:center;flex:none}
.mv-ai svg{width:24px;height:24px}
.mv-box{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.5}
.mv-bb{border:0;border-radius:16px;color:#fff;font-weight:800;font-size:16px;padding:15px;display:flex;align-items:center;justify-content:center;gap:9px}
.mv-bb svg{width:20px;height:20px}
.mv-bb.coral{background:#FF5A47}.mv-bb.navy{background:#14213D}
.mv-ghost{border:0;background:none;color:var(--muted);font-weight:800;font-size:14px;padding:6px}
body.mv-on #fab,body.mv-on #ai-fab{display:none!important}
body.mv-on main .wrap{padding-bottom:0}
@media (max-width:759px){body.mv-on .mv{margin-top:-18px}}
.mv[data-ctl="off"] .mv-ctl{opacity:0;pointer-events:none}
.mv[data-mt="dark"] .mv-top .mv-chip[aria-pressed="true"]{background:#FF5A47;border-color:#FF5A47}
.mv[data-mt="dark"] .mv-top .mv-chip{border-color:transparent}
/* récompenses */
.rw-ban{position:fixed;z-index:75;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);width:min(460px,calc(100% - 24px));background:#14213D;color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 28px rgba(20,33,61,.38);border:0;text-align:left;font:inherit;animation:rwIn .38s cubic-bezier(.2,.9,.3,1.25) both}
.rw-ban.out{animation:rwOut .3s ease both}
@keyframes rwIn{from{opacity:0;transform:translate(-50%,-26px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rwOut{to{opacity:0;transform:translate(-50%,-26px)}}
.rw-ok{width:38px;height:38px;border-radius:50%;background:#1E9A6E;display:grid;place-items:center;flex:none;color:#fff}
.rw-ok svg{width:20px;height:20px}
.rw-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rw-l{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rw-l b{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.2}
.rw-l em{font-style:normal;font-size:12px;font-weight:800;color:#FFB13B;white-space:nowrap}
.rw-bar{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.rw-bar i{display:block;height:6px;background:#FF5A47;border-radius:3px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.rw-ban small{font-size:12px;font-weight:600;color:#A9B6D3}
.rw-cel{position:fixed;inset:0;z-index:80;background:rgba(20,33,61,.55);display:grid;place-items:center;padding:24px;animation:rwFade .25s ease both}
.rw-cel.out{animation:rwFade .25s ease reverse both}
@keyframes rwFade{from{opacity:0}to{opacity:1}}
.rw-card{width:min(360px,100%);background:var(--surface);color:var(--ink);border-radius:26px;padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center;animation:rwPop .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes rwPop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.rw-ring{color:var(--ink)}
.rw-card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.rw-card p{margin:0;font-size:14px;font-weight:600;color:var(--muted);line-height:1.5}
.rw-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.rw-stats div{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface-2);border-radius:14px;padding:12px 6px}
.rw-stats b{font-family:var(--f-display);font-weight:800;font-size:20px}
.rw-stats span{font-size:11px;font-weight:700;color:var(--muted)}
.rw-go{width:100%;border:0;border-radius:16px;background:#14213D;color:#fff;font-weight:800;font-size:16px;padding:15px}
:root[data-theme="dark"] .rw-go{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rw-go{background:var(--accent);color:var(--accent-ink)}}
.confetti{z-index:85!important}
@media (prefers-reduced-motion: reduce){.mv-pin .pulse,.rw-ban,.rw-card,.mv-ac{animation:none}}
.map-legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.map-legend span{display:inline-flex;align-items:center;gap:5px}
.map-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.town-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
/* optimisations */
.express{display:flex;gap:6px;overflow-x:auto;padding-top:2px;scrollbar-width:none}
.express::-webkit-scrollbar{display:none}
.express button{flex:none;border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:6px 10px;font-size:.78rem;font-weight:700;color:var(--ink)}
.express button:hover{border-color:var(--accent);border-style:solid}
.express button[disabled]{opacity:.5}
.call .express{flex-wrap:wrap;overflow:visible}
.mg-obj,.mg-obj-set{margin-top:12px;background:rgba(255,255,255,.08);border:0;border-radius:12px;padding:10px 12px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.mg-obj-set{align-items:center;font-weight:800;font-size:.85rem;border:1px dashed rgba(255,255,255,.3);background:none}
.mg-obj-top{display:flex;justify-content:space-between;font-size:.78rem;font-weight:700}
.mg-obj-top b{font-family:var(--f-display);font-size:1rem}
.mg-obj-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.mg-obj-bar i{display:block;height:100%;background:#1E9A6E;border-radius:4px}
.mg-obj small{font-size:.72rem;opacity:.8}
.tour{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.empty-tour{flex-direction:column;gap:4px}.empty-tour span{color:var(--muted);font-size:.85rem}
.tour-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tour-list li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center}
.tour-list .n{width:26px;height:26px;border-radius:50%;background:#14213D;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.8rem}
.tour-list .tl{background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.tour-list .tl small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour-list .x{background:none;border:0;color:var(--muted);font-weight:800;padding:6px}
.tour-go{text-align:center;text-decoration:none}
.tour-row{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid var(--line)}
.tour-row .crow{border-bottom:0}
.tour-add{display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:0;flex:none;width:36px;height:36px;margin-right:10px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:800;color:var(--accent)}
.tour-add.on{background:#14213D;color:#fff;border-color:#14213D}
.prep{display:flex;flex-direction:column;gap:10px}
.prep-b{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.prep-b.hl{background:#14213D;color:#fff}
.prep-b span{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
.prep-b p{margin:4px 0 0;font-size:.92rem}
.prep-b ul{margin:6px 0 0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.prep-b .obj{margin-top:8px}.prep-b .obj b{font-size:.88rem}.prep-b .obj p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
/* ===== UX dynamique ===== */
@media (prefers-reduced-motion:no-preference){
  #app.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .overlay{animation:fade .18s ease both}.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1) both}
  @media (min-width:700px){.sheet{animation:pop .22s cubic-bezier(.2,.8,.2,1) both}}
  .panel-wrap{animation:fade .18s ease both}.panel,.chat{animation:slide .3s cubic-bezier(.2,.8,.2,1) both}

function tabsHtml(bottom){const late=M?M.g.late.length:0;return VIEWS.map(([k,l])=>`<button class="tab" type="button" data-view="${k}" ${S.view===k?'aria-current="page"':""}>${svg(k,1.9)}${l}${k==="journee"&&late?`<span class="bdg">${late}</span>`:""}</button>`).join("")}
function render(){
  updRefresh();
  const app=$("#app");
  if(S.error&&!S.loaded){const[h,p]=errorCopy(S.error,false);app.innerHTML=`<div class="banner"><strong>${esc(h)}</strong><span>${esc(p)}</span></div>`;$("#fab").hidden=true;$("#tabs-top").innerHTML="";$("#tabs-bottom").innerHTML="";return}
  if(!S.loaded)return;
  const openKeys=[...app.querySelectorAll("details[open]")].map(d=>d.id);
  const ae=document.activeElement,focusId=ae&&ae.id,selStart=focusId&&ae.selectionStart;
  M=build();
  $("#tabs-top").innerHTML=tabsHtml(false);$("#tabs-bottom").innerHTML=tabsHtml(true);
  const banner=S.error?`<div class="banner"><strong>${esc(errorCopy(S.error,false)[0])}</strong><span>${esc(errorCopy(S.error,false)[1])}</span></div>`:"";
  const v={accueil:vAccueil,journee:vJournee,terrain:vTerrain,comptes:vComptes,pipeline:vPipeline,journal:vJournal}[S.view]||vAccueil;
  const changed=S._lastView!==S.view;S._lastView=S.view;
  app.innerHTML=banner+scopeBar()+v();
  if(changed&&!RM){app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter");[...app.children].forEach((el,i)=>el.style.setProperty("--d",Math.min(i,8)*45+"ms"));countUp(app)}
  document.body.classList.toggle("mv-on",S.view==="terrain");if(S.view==="terrain")initMap();else{document.body.classList.remove("mv-fs");if(ENG)mvLeave()}
  openKeys.forEach(k=>{const d=document.getElementById(k);if(d)d.open=true});
  if(focusId==="c-q"||focusId==="j-q"){const el=document.getElementById(focusId);if(el){el.focus();try{el.setSelectionRange(selStart,selStart)}catch(e){}}}
  $("#fab").hidden=false;$("#fab").textContent=S.view==="comptes"?"+ Compte":"+ Action";
  renderFiche();renderCall();
}
function setView(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}try{localStorage.setItem("cp-view",v)}catch(e){}window.scrollTo(0,0);render()}

const RM=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count||0,fmt=el.dataset.fmt;if(!to)return;const t0=performance.now(),dur=750;
    const f=n=>fmt==="eur"?eur(n):String(Math.round(n));
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(to*e);if(k<1)requestAnimationFrame(step);else el.textContent=f(to)};
    el.textContent=f(0);requestAnimationFrame(step)});
}
function confetti(){
  if(RM)return;const c=document.createElement("canvas");c.className="confetti";document.body.appendChild(c);
  const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext("2d"),cols=["#FF5A47","#FFB13B","#1E9A6E","#2C6CD1","#6A4FD1","#FF3D6E"];
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*80,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*6+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();(function fr(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(t-t0<1600)requestAnimationFrame(fr);else c.remove()})(t0);
}
let toastT=null;
function toast(msg){const r=$("#toast-root");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML="",3200)}

/* ---------- forms ---------- */
function closeSheet(){$("#modal-root").innerHTML=""}
function pills(name,opts,cur){return `<div class="pills" data-pills="${name}">${opts.map(o=>`<button type="button" class="pill" data-val="${esc(o)}" aria-pressed="${o===cur}">${esc(o)}</button>`).join("")}</div>`}
function sel(id,opts,cur,blank){const list=cur&&!opts.includes(cur)?[cur,...opts]:opts;return `<select id="${id}">${blank!=null?`<option value="">${esc(blank)}</option>`:""}${list.map(o=>`<option ${o===cur?"selected":""}>${esc(o)}</option>`).join("")}</select>`}
const inp=(id,lbl,v,extra)=>`<div class="field"><label for="${id}">${lbl}</label><input id="${id}" value="${esc(v||"")}" ${extra||""}></div>`;
const dl=(id,opts)=>`<datalist id="${id}">${opts.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>`;
function dateBlock(prefix,defDate,defTime,lbl){
  return `<div class="two"><div class="field"><label for="${prefix}-date">${lbl||"Date"}</label><input type="date" id="${prefix}-date" value="${iso(defDate)}"></div>
    <div class="field"><label for="${prefix}-time">Heure</label>${sel(prefix+"-time",HOURS,defTime||"","Sans heure")}</div></div>
    <div class="pills">${QUICK.map(([l],i)=>`<button type="button" class="pill" data-q="${i}" data-qp="${prefix}">${l}</button>`).join("")}</div>`;
}
const nextBlock=(t,d)=>`<h4>Prochaine action</h4><div class="field"><label for="f-next">Type</label>${sel("f-next",L.types,t||"","Aucune")}</div>${dateBlock("n",d,"","Date")}`;
function openSheet(title,sub,body,opts){
  $("#modal-root").innerHTML=`<div class="overlay" data-close="1"><form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate>
    <h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:""}${body}
    <div class="err" id="f-err" hidden></div>
    <div class="sheet-actions">${opts.left||""}<button type="button" class="btn" data-close="1">Annuler</button><button type="submit" class="btn primary" id="f-save">${opts.save||"Enregistrer"}</button></div></form></div>`;
  const sh=$("#sheet");
  sh.addEventListener("click",e=>{
    const p=e.target.closest(".pill[data-val]");if(p){const g=p.parentElement,was=p.getAttribute("aria-pressed")==="true";g.querySelectorAll(".pill").forEach(x=>x.setAttribute("aria-pressed","false"));p.setAttribute("aria-pressed",String(!was));if(opts.onPill)opts.onPill(g.dataset.pills,p.dataset.val,!was)}
    const q=e.target.closest("[data-q]");if(q){$("#"+q.dataset.qp+"-date").value=iso(QUICK[+q.dataset.q][1]());if(opts.onQuick)opts.onQuick()}
    const del=e.target.closest("[data-del]");if(del&&opts.onDelete)opts.onDelete(del);
  });
  sh.addEventListener("submit",e=>{e.preventDefault();opts.onSave()});
  const first=sh.querySelector("textarea,input:not([type=checkbox]):not([type=date])");if(first&&window.matchMedia("(min-width:700px)").matches)setTimeout(()=>first.focus(),30);
}
function showErr(msg){const el=$("#f-err");el.textContent=msg;el.hidden=false;const b=$("#f-save");if(b)b.disabled=false}
const val=id=>{const el=document.getElementById(id);return el?norm(el.value):""};
const pillVal=name=>{const p=document.querySelector(`[data-pills="${name}"] .pill[aria-pressed="true"]`);return p?p.dataset.val:""};
async function guard(fn){const b=$("#f-save");if(b)b.disabled=true;try{await fn()}catch(e){const[h,p]=errorCopy(e,true);if($("#f-err"))showErr(h+". "+p);else toast(h)}}
async function nextFreeJournalRow(){const fresh=await getRange(J_RANGE);let last=-1;fresh.forEach((r,i)=>{if(norm(r[1]))last=i});return last+3}
const telOut=s=>{s=norm(s);return s&&/^[\d+]/.test(s)?"'"+s:s};

function formAction(mode,task,company,after){
  const co=company||(task&&task.company)||"";const c=M.C.get(co)||{};
  const isNrp=mode==="nrp";const same=task&&L.types.includes(task.action)?task.action:"Appel téléphonique";
  const body=`${mode==="new"?`<div class="field"><label for="f-co">Compte</label><input id="f-co" list="dl-co" value="${esc(co)}" placeholder="Nom de la société" autocomplete="off">${dl("dl-co",M.Clist.map(x=>x.name).sort((a,b)=>a.localeCompare(b,"fr")))}</div>
      <div class="two"><div class="field"><label for="f-type">Action réalisée</label>${sel("f-type",L.types,"Appel téléphonique")}</div><div class="field"><label for="f-date">Date</label><input type="date" id="f-date" value="${iso(today0())}"></div></div>`:""}
    <div class="field"><label for="f-ct">Interlocuteur</label><input id="f-ct" value="${esc(task?(task.contact||c.contact||""):(c.contact||""))}" placeholder="Nom, fonction"></div>
    <div class="field"><label for="f-cr">Compte rendu</label><textarea id="f-cr" placeholder="Ce qui s'est dit, ce qui est convenu">${isNrp?"Ne répond pas.":""}</textarea></div>
    <div class="field"><span class="lbl">Résultat</span>${pills("res",L.resultats,isNrp?"Pas de réponse":"")}</div>
    ${nextBlock(isNrp?same:"",isNrp?addBiz(2):null)}
    <div class="field"><label for="f-st">Statut du compte</label>${sel("f-st",L.statuts,c.statut||"","Ne pas changer")}</div>`;
  openSheet(mode==="new"?"Nouvelle action":"Compte rendu",task?`${task.company} · ${task.action}`:"Enregistre une action déjà réalisée.",body,{
    onPill:(name,v,on)=>{if(name!=="res"||!on)return;const nx=$("#f-next"),dt=$("#n-date");if(dt.value)return;
      if(v==="Pas de réponse"){nx.value=nx.value||same;dt.value=iso(addBiz(2))}
      if(v==="Absent / à rappeler"){nx.value=nx.value||same;dt.value=iso(addBiz(1))}},
    onQuick:()=>{const nx=$("#f-next");if(!nx.value)nx.value=same},
    onSave:()=>guard(async()=>{
      const company=mode==="new"?val("f-co"):task.company;const compte=M.C.get(company);
      if(!company)return showErr("Indique le compte.");
      if(mode==="new"&&!compte)return showErr("Ce compte n'existe pas. Choisis-le dans la liste ou crée-le dans Comptes.");
      const next=val("f-next"),nD=fromIso(val("n-date")),nT=val("n-time");
      if(next&&!nD)return showErr("Choisis la date de la prochaine action.");
      if(!next&&nD)return showErr("Choisis le type de la prochaine action.");
      const cr=val("f-cr"),ct=val("f-ct"),st=val("f-st"),res=pillVal("res"),nd=nD?fr(nD):"",time=next?nT:"";
      if(task&&task.kind==="A")await setRange(`'Journal (base)'!C${task.row}:J${task.row}`,[[ct,task.action,[norm(task.cr),cr].filter(Boolean).join(" "),res,next,nd,time,true]]);
      else{const row=await nextFreeJournalRow();const d=mode==="new"?(fromIso(val("f-date"))||today0()):today0();
        await setRange(`'Journal (base)'!A${row}:K${row}`,[[fr(d),company,ct,mode==="new"?val("f-type"):task.action,cr,res,next,nd,time,true,USER]])}
      if(compte&&st&&st!==compte.statut){try{await setRange(`Comptes!N${compte.row}`,[[st]])}catch(e){toast("Action enregistrée, statut non modifié.")}}
      if(compte&&st==="Gagné"&&compte.statut!=="Gagné"){closeSheet();if(after)after();await load();formWon(M.C.get(compte.name)||compte);return}
      closeSheet();toast("Enregistré dans ton CRM");if(after)after();await load();
    })});
}

document.addEventListener("click",async e=>{
  const cp=e.target.closest("[data-copy]");
  if(cp){try{await navigator.clipboard.writeText(cp.dataset.copy);cp.textContent="Copié";setTimeout(()=>cp.textContent="Copier",1400)}catch(err){const s=window.getSelection(),r=document.createRange();r.selectNodeContents(cp.previousElementSibling||cp.parentElement);s.removeAllRanges();s.addRange(r)}return}

async function mvGeocodeQueue(){
  if(GEO_RUN||GEO_OFF||!M)return;const G=geoAll(),seen=new Set();

}

const MV_STYLE="https://tiles.openfreemap.org/styles/positron",MV_ALT=["https://tiles.openfreemap.org/styles/liberty","local"];

      const data={type:"FeatureCollection",features:line&&line.c.length>1?[{type:"Feature",properties:{},geometry:{type:"LineString",coordinates:line.c.map(p=>[p[1],p[0]])}}]:[]};
      try{if(map.getSource("mv-route"))map.getSource("mv-route").setData(data);
        else{map.addSource("mv-route",{type:"geojson",data});
          map.addLayer({id:"mv-route-h",type:"line",source:"mv-route",paint:{"line-color":"rgba(255,90,71,.32)","line-width":13},layout:{"line-cap":"round","line-join":"round"}});

    map._try=0;map._te=0;

    map.on("error",()=>{if(map._local)return;const ok=map.isStyleLoaded&&map.isStyleLoaded();if(ok&&(map._tok||++map._te<6))return;
      const alt=MV_ALT[map._try++];map._te=0;if(alt){try{map.setStyle(alt==="local"?mvLocalStyle():alt)}catch(e){}}});

      fit(lls,now){if(!lls.length)return;if(lls.length===1)return this.fly(lls[0],14);const b=new ML.LngLatBounds();lls.forEach(p=>b.extend([p[1],p[0]]));try{map.fitBounds(b,{padding:mvPad(10),maxZoom:15,duration:now?0:600})}catch(e){}},
      zoom:()=>map.getZoom(),center:()=>{const c=map.getCenter();return[c.lat,c.lng]},

/* --- tournée sur les routes --- */
function tourGet(){if(!S_T.tour){try{S_T.tour=JSON.parse(localStorage.getItem("df-tour")||"[]")}catch(e){S_T.tour=[]}}return S_T.tour}
function tourSave(){try{localStorage.setItem("df-tour",JSON.stringify(S_T.tour||[]))}catch(e){}}
function tourToggle(name){const t=tourGet();const i=t.indexOf(name);if(i>=0)t.splice(i,1);else t.push(name);tourSave()}
const mvTourPts=()=>tourGet().map(n=>M.C.get(n)).filter(Boolean);
function mvTourKey(){return(S_T.me?S_T.me.map(x=>x.toFixed(2)).join(","):"-")+"|"+mvTourPts().map(c=>c.name+"@"+(c._ll?c._ll.map(x=>x.toFixed(4)).join(","):"?")).join(";")}
function tourOrdered(){
  const pts=mvTourPts().map(c=>({c,ll:c._ll}));if(pts.length<2)return pts;
  let cur=S_T.me||(pts.find(p=>p.ll)||{}).ll,rest=pts.slice(),out=[];if(!cur)return pts;
  while(rest.length){let bi=0,bd=1e9;rest.forEach((p,i)=>{const d=p.ll?kmBetween(cur,p.ll):5e3;if(d<bd){bd=d;bi=i}});const n=rest.splice(bi,1)[0];out.push(n);if(n.ll)cur=n.ll}
  return out;
}
function mvTourOrder(){
  mvAllPts();const ps=mvTourPts(),R=S_T.route;
  if(R&&R.key===mvTourKey()&&R.order){const seen=new Set(R.order);const o=R.order.map(i=>ps[i]).filter(Boolean).map(c=>({c,ll:c._ll}));ps.forEach((c,i)=>{if(!seen.has(i))o.push({c,ll:c._ll})});return o}
  return tourOrdered();
}
const mvTourNext=o=>o.find(p=>!mvVisitedToday(p.c.name))||null;
const mvPathKm=pts=>{let s=0;for(let i=1;i<pts.length;i++)s+=kmBetween(pts[i-1],pts[i]);return s};
async function osrm(svc,coords,first){
  const q=coords.map(p=>(+p[1]).toFixed(5)+","+(+p[0]).toFixed(5)).join(";");
  const qs=svc==="trip"?`?roundtrip=true&source=${first?"first":"any"}&destination=any&overview=false`:"?overview=full&geometries=geojson";
  let j=null;try{j=await fetchJson(`https://router.project-osrm.org/${svc}/v1/driving/${q}${qs}`,9000)}catch(e){j=await dfOp({op:"osrm",svc,q,first:!!first})}
  if(!j||j.code!=="Ok")throw new Error("Itinéraire indisponible");return j;
}
async function mvRoute(){
  mvAllPts();const ps=mvTourPts(),key=mvTourKey();
  if(!ps.length){S_T.route=null;return}
  if((S_T.route&&S_T.route.key===key)||S_T._rk===key)return;
  const ok=ps.map((c,i)=>({c,i})).filter(x=>x.c._ll);if(!ok.length){S_T.route={key,fail:true};return}
  S_T._rk=key;const start=S_T.me?[S_T.me]:[];
  try{
    let order=ok.map(x=>x.i);
    if(ok.length>=2){
      const coords=start.concat(ok.map(x=>x.c._ll));const t=await osrm("trip",coords,!!S_T.me);
      const seq=t.waypoints.map((w,i)=>({i,k:w.waypoint_index})).sort((a,b)=>a.k-b.k).map(w=>w.i);
      let cyc=seq;
      if(S_T.me){const z=cyc.indexOf(0);cyc=cyc.slice(z).concat(cyc.slice(0,z)).slice(1)}
      else{let bi=0,bd=-1;for(let n=0;n<cyc.length;n++){const a=coords[cyc[n]],b=coords[cyc[(n+1)%cyc.length]];const d=kmBetween(a,b);if(d>bd){bd=d;bi=n}}cyc=cyc.slice(bi+1).concat(cyc.slice(0,bi+1))}
      order=cyc.map(n=>ok[n-start.length].i);
    }
    const seqLL=start.concat(order.map(i=>ps[i]._ll));let geom=null,km=0,min=0;
    if(seqLL.length>=2){const r=await osrm("route",seqLL.slice(0,25));const rt=r.routes&&r.routes[0];if(rt){geom=rt.geometry.coordinates.map(c=>[c[1],c[0]]);km=rt.distance/1000;min=rt.duration/60}}
    const naive=mvPathKm(start.concat(ps.filter(c=>c._ll).map(c=>c._ll))),opt=mvPathKm(seqLL);
    const saved=opt>0&&km?Math.max(0,(naive-opt)*(km/opt)):0;
    S_T.route={key,order,geom,km,min,saved};
  }catch(e){S_T.route={key,fail:true}}
  S_T._rk=null;if(ENG&&S_T.mode==="tour"){mvDraw();mvSheetRender()}
}

const DISC_SRC=[["","Tous secteurs"],["I","Hôtels et restaurants"],["F","BTP"],["Q","Santé"],["G","Commerces"],["M","Comptables, conseil, juridique"],["L","Immobilier"],["H","Transport"],["C","Industrie"],["J","Numérique"],["P","Enseignement"],["S","Associations et services"]];

async function nearPage(ll,r,sec,page){

  try{const a=await fetchJson(u,9000);return{list:(a.results||[]).map(nearNorm),pages:a.total_pages||1,total:a.total_results||0}}
  catch(e){const j=await dfOp({op:"near",lat:ll[0],lng:ll[1],radius:r,sec:sec||"",page});return{list:j.results||[],pages:j.pages||(j.results&&j.results.length>=25?page+2:page),total:j.total||0}}
}
async function nearSearch(ll,r,sec,page){
  const a=await nearPage(ll,r,sec,page);let list=a.list;
  if(a.pages>page){try{const b=await nearPage(ll,r,sec,page+1);list=list.concat(b.list)}catch(e){}}

}
function discSec(naf){
  const d=parseInt(String(naf||"").slice(0,2),10);if(!d)return"Autres";
  if(d===55)return"Hôtels";if(d===56)return"Restaurants";if(d>=41&&d<=43)return"BTP";if(d===69)return"Comptables / juridique";if(d===68)return"Immobilier";
  if(d===86||d===87||d===88)return"Santé";if(d>=45&&d<=47)return"Commerces";if(d>=49&&d<=53)return"Transport";if(d>=10&&d<=33)return"Industrie";
  if(d>=58&&d<=63)return"Numérique";if(d>=70&&d<=75)return"Conseil";if(d===85)return"Enseignement";if(d===84)return"Public";if(d===93||d===90||d===91)return"Loisirs";if(d===94)return"Associations";return"Services";
}
function discClean(list,at,seen){
  const have=new Set(M.ClistAll.map(c=>deacc(c.name.replace(/\s*\(.*?\)\s*/g," "))));

    if(e.etat==="C"||/^1/.test(e.nj)||e.nj==="6540"||!e.nom)return false;const n=deacc(e.nom);if(have.has(n)||[...have].some(h=>h.length>4&&(n.includes(h)||h.includes(n))))return false;return true})
  .map(e=>{e.ll=e.lat&&e.lng?[e.lat,e.lng]:null;e.d=e.ll?kmBetween(at,e.ll):null;e.sec=discSec(e.naf);return e});

async function mvDiscover(at,more){

function mvWatch(center){
  if(center)S_T._wantCenter=true;

  if(!navigator.geolocation){S_T.askCity=true;mvSheetRender();return}
  if(center)toast("Recherche de ta position…");
  try{MV_WATCH=navigator.geolocation.watchPosition(p=>mvPos(p),err=>{mvUnwatch();if(center){S_T.askCity=true;mvSheetRender();toast(err&&err.code===1?"Autorise la localisation pour DealFlow dans les réglages de l'iPhone":"Position introuvable pour l'instant")}},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}

}

  const ll=[p.coords.latitude,p.coords.longitude],first=!S_T.me||S_T._wantCenter;

  const now=Date.now();if(!S_T._near||S_T._near.n!==best.name){S_T._near={n:best.name,t:now};return}

/* ---------- session mailing ---------- */
const MAIL_RULES=`Tu rédiges un mail de prospection pour Mehdi, consultant IT chez SRE Groupe.
Faits SRE Groupe à utiliser, et uniquement ceux-là : basé à Valbonne, 38 ans d'existence, plus de 900 références clients sur la Côte d'Azur. Accompagne les entreprises dans leur transition numérique. Audits gratuits et sans engagement sur la téléphonie et le réseau. Mise en conformité facture électronique (Factur-X). Parc d'impression avec une approche multimarque qui permet de proposer la solution la plus adaptée à chaque structure. GED Zeendoc. Mobilier de bureau et équipement complet d'un bureau (fournitures, bureaux, écrans, postes). SRE développe la zone du Var, Mehdi étant basé à Fréjus. N'écris jamais « entreprise varoise ». Ne parle d'audit que si c'est pertinent pour le besoin du compte.
Règles strictes : en prose, aucune puce, aucun emoji, aucun deux-points dans le corps du mail, phrases simples, claires et directes, sans tournure bizarre, vouvoiement, 5 à 8 phrases. Personnalise avec ce qui s'est dit (qui, quand, quel besoin). Si c'est une relance, rappelle brièvement le premier échange. Commence par « Bonjour » suivi du nom de l'interlocuteur s'il est connu. Termine par la signature exacte sur trois lignes : Mehdi, puis SRE Groupe, puis 07 62 86 34 60.
Réponds uniquement avec un objet JSON de la forme {"objet": "...", "corps": "..."}, le corps avec de vrais retours à la ligne.`;
function mailPrompt(c,action,extra){
  const hist=c.rows.slice(-10).map(r=>`${r.a?fr(r.a):"?"} · ${r.d} · ${r.c?r.c+" · ":""}${r.e}${r.f?" ("+r.f+")":""}`).join("\n")||"aucun";
  return `${MAIL_RULES}

Type de mail : ${action}.
Compte : ${c.name}
Secteur : ${c.secteur||"?"} · Ville : ${c.ville||"?"}
Interlocuteur : ${[c.contact,c.fonction].filter(Boolean).join(", ")||"inconnu"}
Besoin identifié : ${c.besoin||"?"} · Prestataire actuel : ${c.presta||"?"} · Échéance : ${c.echeance||"?"}
Commentaire : ${c.comment||"-"}
Historique :
${hist}
${extra?`\nConsigne de Mehdi pour cette version : ${extra}`:""}`;
}
async function draftMail(job,extra){
  const c=M.C.get(job.company);if(!c){job.err="Compte introuvable.";renderMail();return}
  if(!sampleFn){job.err="La rédaction automatique fonctionne dans DealFlow ouvert dans Claude. Ici, écris ton mail toi-même puis marque-le envoyé.";job.objet=job.objet||"";job.corps=job.corps||"";renderMail();return}
  job.loading=true;job.err="";job.ctl=new AbortController();renderMail();

    const k=Math.min(1,(max||1600)/Math.max(im.naturalWidth,im.naturalHeight));

    CLA.res=res;CLA.step="done";CLA.text="";claKeep();renderClaudia();if(!RM)confetti();
  }catch(e){
    const left=CLA.items.filter(x=>x.on).length;CLA.items.forEach(x=>{if(!x.saved&&items.includes(x))x.on=true});
    CLA.step="review";CLA.err=errorCopy(e,true).join(". ")+(res.nNew+res.nUpd+res.nAct?` Déjà enregistré · ${res.nNew+res.nUpd} fiche(s), ${res.nAct} action(s). Les entreprises encore cochées restent à enregistrer.`:"");

function entrepriseOn(){return !!CFG}
async function entrepriseSearch(q){const j=await api("POST",{op:"siren",q});return Array.isArray(j.results)?j.results:[]}
let ENT=[];
const EFF={"00":"0 salarié","01":"1 ou 2 salariés","02":"3 à 5 salariés","03":"6 à 9 salariés","11":"10 à 19 salariés","12":"20 à 49 salariés","21":"50 à 99 salariés","22":"100 à 199 salariés","31":"200 à 249 salariés","32":"250 à 499 salariés","41":"500 à 999 salariés","42":"1 000 à 1 999 salariés","51":"2 000 à 4 999 salariés","52":"5 000 à 9 999 salariés","53":"10 000 salariés et plus"};
function tc(s){return String(s||"").toLowerCase().replace(/(^|[\s\-'’(\/])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Du|Des|La|Le|Les|Et|En|Sur|Sous|Aux|Au|D'|L')\b/g,w=>w.toLowerCase()).replace(/^./,c=>c.toUpperCase())}
function deacc(s){return low(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function entSecteur(e){
  const n=String(e.naf||""),d=parseInt(n.slice(0,2),10),nj=String(e.nj||"");
  let s="";
  if(n.startsWith("69.1"))s="Juridique";else if(n.startsWith("69.2"))s="Comptabilité / Expertise";
  else if(d===55||d===56)s="Hôtellerie / Restauration";else if(d>=41&&d<=43)s="BTP";else if(d===68)s="Immobilier";
  else if(d>=45&&d<=47)s="Commerce";else if(d===75||(d>=86&&d<=88))s="Santé";else if(d>=10&&d<=33)s="Industrie";
  else if(d===84||nj.startsWith("72")||nj.startsWith("73"))s="Collectivité";else if(d>=49&&d<=53)s="Transport / Logistique";
  else if(d===94||nj.startsWith("92"))s="Association";else if(d)s="Services";
  const hit=(L.secteurs||[]).find(x=>deacc(x)===deacc(s));return hit||((L.secteurs||[]).length?"":s);
}
function entInfo(e){
  const villeRaw=e.ville||"",vh=(L.villes||[]).find(v=>deacc(v)===deacc(villeRaw));

}

const CAL_LONG=/RDV|Visite|Remise/;
function calTimes(t){
  const d=new Date(t.date);let start,end,allDay=!t.time;
  if(t.time){const[h,m]=t.time.split(":").map(Number);d.setHours(h||0,m||0,0,0);start=d;end=new Date(d.getTime()+(CAL_LONG.test(t.action)?60:15)*60000)}
  else{start=d;end=new Date(d.getTime()+864e5)}
  return{start,end,allDay};
}
function calText(t){
  const c=M.C.get(t.company)||{};const note=M.lastNote.get(t.company)||"";
  return{subject:`${t.action} · ${t.company}`,location:[c.adresse,c.ville].filter(Boolean).join(", "),
    body:[t.contact||c.contact?`Contact : ${t.contact||c.contact}${c.fonction?" ("+c.fonction+")":""}`:"",c.tel?`Tél : ${c.tel}`:"",c.email?`Mail : ${c.email}`:"",c.statut?`Statut : ${c.statut}`:"",note?`Dernier échange : ${note}`:"","Ajouté depuis DealFlow"].filter(Boolean).join("\n")};
}
function isoLocal(d){const p=n=>String(n).padStart(2,"0"),o=-d.getTimezoneOffset(),sg=o>=0?"+":"-";return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00${sg}${p(Math.floor(Math.abs(o)/60))}:${p(Math.abs(o)%60)}`}
function outlookUrl(t,perso){
  const{start,end,allDay}=calTimes(t),x=calText(t);
  const q={path:"/calendar/action/compose",rru:"addevent",subject:x.subject,body:x.body,location:x.location,startdt:allDay?isoLocal(start).slice(0,10):isoLocal(start),enddt:allDay?isoLocal(end).slice(0,10):isoLocal(end),allday:String(allDay)};
  return (perso?"https://outlook.live.com":"https://outlook.office.com")+"/calendar/0/deeplink/compose?"+Object.entries(q).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
}
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n")}
function icsFile(t){

  const utc=d=>`${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}T${p(d.getUTCHours())}${p(d.getUTCMinutes())}00Z`,day=d=>`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;

function formCal(t){

  const ck=$("#cal-perso");if(ck)ck.onchange=()=>{try{localStorage.setItem("df-outlook",ck.checked?"perso":"pro")}catch(e){}const a=document.querySelector("[data-calgo]");if(a)a.href=outlookUrl(t,ck.checked)};
}
function icsDownload(t){
  const blob=new Blob([icsFile(t)],{type:"text/calendar;charset=utf-8"}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=("DealFlow "+t.company).replace(/[^\w\- ]+/g,"").slice(0,40)+".ics";document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},4000);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-cal]");if(b&&M){const t=M.all.find(x=>x.id===b.dataset.cal);if(t)formCal(t);return}
  const ic=e.target.closest("[data-calics]");if(ic&&M){const t=M.all.find(x=>x.id===ic.dataset.calics);if(t)icsDownload(t);return}
});

  catch(e){box.innerHTML=`<div class="err">${esc(e.message||"Lien indisponible. Mets à jour l'Apps Script.")}</div>`}
}
